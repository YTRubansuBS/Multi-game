<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Squid Game 3D</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;color:#fff;font-family:Arial,sans-serif;touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}#menu{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#101820,#35111e,#080b10);padding:15px}.panel{width:min(94vw,620px);padding:30px;border:2px solid #ff315f;border-radius:25px;background:#090d13f5;text-align:center;box-shadow:0 0 60px #ff315f44}.logo{font-size:48px;color:#ff315f;margin:0 0 8px}.games{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:24px}.btn{border:0;border-radius:15px;padding:17px;color:#fff;background:#e91e56;font-size:16px;font-weight:900;cursor:pointer;box-shadow:0 5px #8c1034}.btn:active{transform:translateY(3px);box-shadow:0 2px #8c1034}.dark{background:#293641;box-shadow:0 5px #111820}.help{margin-top:20px;padding:13px;border-radius:12px;background:#17212a;color:#bdc8cf;line-height:1.5}#hud{position:fixed;z-index:8;left:12px;top:12px;display:none;flex-direction:column;gap:7px}.badge{background:#071018e8;border:1px solid #fff3;border-radius:12px;padding:9px 13px;font-weight:900}#back{position:fixed;right:12px;top:12px;z-index:9;display:none}#touch{position:fixed;inset:0;z-index:9;display:none;pointer-events:none}#joy{position:absolute;left:20px;bottom:20px;width:150px;height:150px;border-radius:50%;background:#fff2;border:2px solid #fff5;pointer-events:auto}#knob{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px;border-radius:50%;background:#fff7;border:2px solid #fff}#jump,#attack{position:absolute;border:2px solid #fff9;border-radius:50%;color:#fff;font-weight:900;pointer-events:auto}#jump{right:20px;bottom:25px;width:110px;height:110px;background:#e91e56e8}#attack{right:145px;bottom:28px;width:78px;height:78px;background:#273641e8;font-size:24px}#toast{position:fixed;z-index:20;left:50%;bottom:185px;transform:translateX(-50%);display:none;background:#071018ed;padding:13px 18px;border-radius:12px;font-weight:900;text-align:center;max-width:90vw}.hidden{display:none!important}</style></head><body><canvas id="game"></canvas><div id="menu"><div class="panel"><h1 class="logo">🦑 SQUID GAME 3D</h1><p>Choisis ton épreuve</p><div class="games"><button class="btn" id="sunBtn">🟢 1, 2, 3 Soleil</button><button class="btn" id="glassBtn">🌉 Pont en verre</button><button class="btn" id="dalgonaBtn">🍪 Dalgona</button><button class="btn" id="pvpBtn">⚔️ PvP</button></div><div class="help">💻 PC : WASD / flèches + ESPACE<br>📱 Mobile : joystick + SAUT<br>⚔️ PvP : bouton attaque</div></div></div><div id="hud"><div class="badge" id="stage">Épreuve</div><div class="badge" id="info">Prêt</div><div class="badge" id="light">🟢 BOUGE</div></div><button id="back" class="btn dark">☰ LOBBY</button><div id="touch"><div id="joy"><div id="knob"></div></div><button id="attack">⚔️</button><button id="jump">SAUT</button></div><div id="toast"></div><script>(function(){'use strict';var c=document.getElementById('game'),x=c.getContext('2d'),W=innerWidth,H=innerHeight,mode='',running=false,alive=true,won=false,keys={},joyX=0,joyY=0,joyDown=false,vy=0,ground=true,lightGreen=true,lightTimer=0,enemies=[],panels=[];function resize(){W=innerWidth;H=innerHeight;c.width=Math.floor(W*devicePixelRatio);c.height=Math.floor(H*devicePixelRatio);x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();function P(X,Y,Z){return{x:X,y:Y,z:Z}}function project(p){var camZ=12,den=p.z-camZ;den=Math.abs(den)<.1?(den<0?-.1:.1):den;var scale=650/den;return{x:W/2+p.x*scale,y:H*.54-p.y*scale,scale:Math.abs(scale)}}function poly(points,fill,stroke){x.beginPath();points.forEach(function(p,i){i?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y)});x.closePath();x.fillStyle=fill;x.fill();if(stroke){x.strokeStyle=stroke;x.stroke()}}function cube(px,py,pz,w,h,d,col){var q=[P(px-w/2,py,pz-d/2),P(px+w/2,py,pz-d/2),P(px+w/2,py+h,pz-d/2),P(px-w/2,py+h,pz-d/2),P(px-w/2,py,pz+d/2),P(px+w/2,py,pz+d/2),P(px+w/2,py+h,pz+d/2),P(px-w/2,py+h,pz+d/2)],r=q.map(project);poly([r[0],r[1],r[2],r[3]],col);poly([r[1],r[5],r[6],r[2]],col);poly([r[3],r[2],r[6],r[7]],col)}function person(px,py,pz,col,scale){scale=scale||1;cube(px,py,pz,.8*scale,1.3*scale,.55*scale,col);var h=project(P(px,py+1.85*scale,pz)),rr=Math.max(5,17*h.scale/60);x.fillStyle='#ffc59b';x.beginPath();x.arc(h.x,h.y,rr,0,Math.PI*2);x.fill();var body=project(P(px,py+1.25*scale,pz));x.fillStyle='#22252b';x.fillRect(body.x-rr*.8,body.y-rr*.25,rr*1.6,rr*.45)}function groundPlane(col){var a=project(P(-45,0,-55)),b=project(P(45,0,-55)),d=project(P(45,0,35)),e=project(P(-45,0,35));poly([a,b,d,e],col)}var player={x:0,y:0,z:15};function start(m){mode=m;running=true;alive=true;won=false;vy=0;ground=true;lightGreen=true;lightTimer=0;player={x:0,y:0,z:15};enemies=[];panels=[];document.getElementById('menu').classList.add('hidden');document.getElementById('hud').style.display='flex';document.getElementById('back').style.display='block';document.getElementById('touch').style.display=m==='dalgona'?'none':'block';document.getElementById('stage').textContent={sun:'🟢 1, 2, 3 Soleil',glass:'🌉 Pont en verre',dalgona:'🍪 Dalgona',pvp:'⚔️ PvP'}[m];document.getElementById('info').textContent=m==='sun'?'Atteins la ligne !':m==='glass'?'Une vitre sur deux est sûre !':m==='pvp'?'Élimine les adversaires !':'Trace la forme !';if(m==='pvp')for(var i=0;i<5;i++)enemies.push({x:(i-2)*4,y:0,z:-5-i*3,hp:2});if(m==='glass')for(var j=0;j<10;j++)panels.push({z:12-j*4.5,safe:j%2?1:-1});if(m==='dalgona')dalgona();toast('🎮 Épreuve lancée !')}function lobby(){running=false;document.getElementById('menu').classList.remove('hidden');document.getElementById('hud').style.display='none';document.getElementById('back').style.display='none';document.getElementById('touch').style.display='none';var d=document.getElementById('dalgona');if(d)d.remove()}function jump(){if(running&&alive&&ground&&mode!=='dalgona'){vy=9;ground=false}}function attack(){if(mode!=='pvp'||!alive)return;enemies.forEach(function(e){if(Math.hypot(e.x-player.x,e.z-player.z)<3){e.hp--;e.z-=2;if(e.hp<=0)e.dead=true}});enemies=enemies.filter(function(e){return !e.dead});toast('⚔️ ATTAQUE !')}function toast(t){var e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(e.tt);e.tt=setTimeout(function(){e.style.display='none'},1800)}document.getElementById('sunBtn').addEventListener('click',function(){start('sun')});document.getElementById('glassBtn').addEventListener('click',function(){start('glass')});document.getElementById('dalgonaBtn').addEventListener('click',function(){start('dalgona')});document.getElementById('pvpBtn').addEventListener('click',function(){start('pvp')});document.getElementById('back').addEventListener('click',lobby);document.getElementById('jump').addEventListener('click',jump);document.getElementById('attack').addEventListener('click',attack);addEventListener('keydown',function(e){keys[e.key.toLowerCase()]=1;if(e.code==='Space')jump()});addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=0});var joy=document.getElementById('joy');joy.onpointerdown=function(e){joyDown=true;joyMove(e)};addEventListener('pointermove',function(e){if(joyDown)joyMove(e)});addEventListener('pointerup',function(){joyDown=false;joyX=joyY=0;document.getElementById('knob').style.transform='translate(-50%,-50%)'});function joyMove(e){var r=joy.getBoundingClientRect(),xx=e.clientX-r.left-r.width/2,yy=e.clientY-r.top-r.height/2,m=55,d=Math.hypot(xx,yy);if(d>m){xx=xx/d*m;yy=yy/d*m}joyX=xx/m;joyY=yy/m;document.getElementById('knob').style.transform='translate(calc(-50% + '+xx+'px),calc(-50% + '+yy+'px))'}function update(dt){if(!running||!alive)return;var mx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joyX,mz=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+joyY,n=Math.hypot(mx,mz);if(n>1){mx/=n;mz/=n}player.x+=mx*7*dt;player.z+=mz*7*dt;vy-=22*dt;player.y+=vy*dt;if(player.y<=0){player.y=0;vy=0;ground=true}if(mode==='sun'){lightTimer+=dt;if(lightTimer>(lightGreen?2.8:2.3)){lightGreen=!lightGreen;lightTimer=0}document.getElementById('light').textContent=lightGreen?'🟢 BOUGE':'🔴 STOP';if(!lightGreen&&n>.12){alive=false;toast('💀 ÉLIMINÉ !');setTimeout(lobby,1400)}if(player.z<-35&&!won){won=true;toast('🏆 VICTOIRE !');setTimeout(lobby,1400)}}if(mode==='glass'){for(var i=0;i<panels.length;i++){var q=panels[i];if(Math.abs(player.z-q.z)<2.2&&Math.abs(player.x)<4){var side=player.x<0?-1:1;if(side!==q.safe){alive=false;toast('💀 MAUVAISE VITRE !');setTimeout(lobby,1400)}}}if(player.z<-35&&!won){won=true;toast('🏆 PONT TRAVERSÉ !');setTimeout(lobby,1400)}}if(mode==='pvp')enemies.forEach(function(e){var dx=player.x-e.x,dz=player.z-e.z,d=Math.hypot(dx,dz);if(d<9&&d>.01){e.x+=dx/d*1.7*dt;e.z+=dz/d*1.7*dt}if(d<1.1){alive=false;toast('💀 ÉLIMINÉ !');setTimeout(lobby,1400)}})}function draw(){x.clearRect(0,0,W,H);var sky=x.createLinearGradient(0,0,0,H*.65);sky.addColorStop(0,mode==='glass'?'#07101c':'#76acc4');sky.addColorStop(1,mode==='glass'?'#17233a':'#c9dce3');x.fillStyle=sky;x.fillRect(0,0,W,H);groundPlane(mode==='glass'?'#1b2028':mode==='pvp'?'#414950':'#56625d');if(mode==='sun'){cube(0,0,-37,45,.3,1,'#ff315f');person(0,0,-41,'#f0d0b0',1.7)}if(mode==='glass'){panels.forEach(function(q){cube(-2.2,.08,q.z,3.5,.18,3.7,'#52c7ee88');cube(2.2,.08,q.z,3.5,.18,3.7,'#52c7ee88')})}if(mode==='pvp')enemies.forEach(function(e){person(e.x,e.y,e.z,'#e91e56',1)});if(running&&mode!=='dalgona')person(player.x,player.y,player.z,'#20c985',1);var cp=project(P(player.x,0,player.z));x.fillStyle='#0005';x.beginPath();x.ellipse(cp.x,cp.y,22*cp.scale/50,8*cp.scale/50,0,0,Math.PI*2);x.fill();if(mode==='sun'){var t=lightGreen?'🟢 BOUGE':'🔴 STOP';x.font='bold 25px Arial';x.textAlign='center';x.fillStyle='#fff';x.fillText(t,W/2,70)}}function dalgona(){var ui=document.createElement('div');ui.id='dalgona';ui.style='position:fixed';ui.style.inset='0';ui.style.zIndex='30';ui.style.background='#190e08f7';ui.style.display='flex';ui.style.alignItems='center';ui.style.justifyContent='center';ui.innerHTML='<div style="position:relative;width:min(76vw,420px);height:min(76vw,420px);border-radius:50%;background:#d99a45;box-shadow:inset 0 0 0 12px #a96728,0 20px 50px #000"><h2 style="position:absolute;top:-65px;width:100%;text-align:center">🍪 Trace la forme !</h2><div id="shape" style="position:absolute;inset:18%;border:6px dashed #593316;border-radius:50%;clip-path:polygon(50% 0,61% 34%,98% 35%,69% 57%,79% 100%,50% 72%,21% 100%,31% 57%,2% 35%,39% 34%);pointer-events:none"></div><div style="position:absolute;left:10%;right:10%;bottom:-55px;height:15px;background:#fff3;border-radius:10px;overflow:hidden"><div id="fill" style="height:100%;width:0;background:#4be18a"></div></div></div>';document.body.appendChild(ui);var co=ui.firstElementChild,fill=ui.querySelector('#fill'),p=0;function drawD(e){var r=co.getBoundingClientRect(),xx=e.clientX-r.left,yy=e.clientY-r.top;if(Math.hypot(xx-r.width/2,yy-r.height/2)<r.width*.43){p=Math.min(1,p+.025);fill.style.width=p*100+'%';if(p>=1){ui.remove();toast('🏆 DALGONA RÉUSSIE !');setTimeout(lobby,1200)}}}co.onpointerdown=drawD;co.onpointermove=drawD;setTimeout(function(){if(ui.isConnected){ui.remove();toast('💀 DALGONA RATÉE !');setTimeout(lobby,1200)}},18000)}function loop(t){var dt=Math.min((t-(loop.last||t))/1000,.05);loop.last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop)})();</script></body></html>

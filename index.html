<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Squid Game 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#fff;font-family:Arial,sans-serif;touch-action:none}#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}#loading{position:fixed;inset:0;z-index:100;background:#101820;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:900;text-align:center;padding:25px}#menu{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#101820,#32111c,#080b10);padding:15px}.panel{width:min(94vw,600px);padding:30px;border:2px solid #ff315f;border-radius:25px;background:#090d13f7;text-align:center;box-shadow:0 0 60px #ff315f44}.logo{font-size:52px;color:#ff315f;margin:0 0 10px;text-shadow:0 5px #551025}.sub{color:#d2d9df}.games{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:25px}.btn{border:0;border-radius:15px;padding:17px 10px;color:#fff;background:#e91e56;font-size:16px;font-weight:900;cursor:pointer;box-shadow:0 5px #8c1034}.btn:active{transform:translateY(3px);box-shadow:0 2px #8c1034}.dark{background:#293641;box-shadow:0 5px #111820}.help{margin-top:20px;padding:13px;border-radius:12px;background:#17212a;color:#bdc8cf;line-height:1.5}#hud{position:fixed;z-index:10;left:12px;top:12px;display:none;flex-direction:column;gap:7px;pointer-events:none}.badge{background:#071018e8;border:1px solid #fff3;border-radius:12px;padding:9px 13px;font-weight:900}#back{position:fixed;right:12px;top:12px;z-index:12;display:none}#touch{position:fixed;inset:0;z-index:11;display:none;pointer-events:none}#joy{position:absolute;left:20px;bottom:20px;width:150px;height:150px;border-radius:50%;background:#fff2;border:2px solid #fff5;pointer-events:auto}#knob{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px;border-radius:50%;background:#fff7;border:2px solid #fff}#jump,#attack{position:absolute;border:2px solid #fff9;border-radius:50%;color:#fff;font-weight:900;pointer-events:auto}#jump{right:20px;bottom:25px;width:110px;height:110px;background:#e91e56e8;font-size:18px}#attack{right:145px;bottom:28px;width:78px;height:78px;background:#273641e8;font-size:24px}#toast{position:fixed;z-index:30;left:50%;bottom:185px;transform:translateX(-50%);display:none;background:#071018ed;padding:13px 18px;border-radius:12px;font-weight:900;text-align:center;max-width:90vw}.hidden{display:none!important}#dalgona{position:fixed;inset:0;z-index:40;background:#190e08f7;display:flex;align-items:center;justify-content:center}.cookie{position:relative;width:min(76vw,420px);height:min(76vw,420px);border-radius:50%;background:#d99a45;box-shadow:inset 0 0 0 12px #a96728,0 20px 50px #000;touch-action:none}.cookie h2{position:absolute;top:-65px;width:100%;text-align:center;font-size:19px}.shape{position:absolute;inset:18%;border:6px dashed #593316;border-radius:50%;clip-path:polygon(50% 0,61% 34%,98% 35%,69% 57%,79% 100%,50% 72%,21% 100%,31% 57%,2% 35%,39% 34%);pointer-events:none}.bar{position:absolute;left:10%;right:10%;bottom:-55px;height:15px;background:#fff3;border-radius:10px;overflow:hidden}.fill{height:100%;width:0;background:#4be18a}
</style>
</head>
<body>
<div id="loading">🦑 Chargement du jeu 3D...<br><small>Initialisation...</small></div><div id="game"></div>
<div id="menu"><div class="panel"><h1 class="logo">🦑 SQUID GAME 3D</h1><div class="sub">Choisis ton épreuve</div><div class="games"><button class="btn" data-mode="sun">🟢 1, 2, 3 Soleil</button><button class="btn" data-mode="glass">🌉 Pont en verre</button><button class="btn" data-mode="dalgona">🍪 Dalgona</button><button class="btn" data-mode="pvp">⚔️ PvP</button></div><div class="help">💻 PC : WASD / flèches + ESPACE<br>📱 Mobile : joystick + SAUT<br>⚔️ PvP : bouton attaque</div></div></div>
<div id="hud"><div class="badge" id="stage">Épreuve</div><div class="badge" id="info">Prêt</div><div class="badge" id="light">🟢 BOUGE</div></div><button id="back" class="btn dark">☰ LOBBY</button><div id="touch"><div id="joy"><div id="knob"></div></div><button id="attack">⚔️</button><button id="jump">SAUT</button></div><div id="toast"></div>
<script>
'use strict';
let scene,camera,renderer,player,mode='',keys={},vy=0,grounded=true,alive=true,won=false,green=true,enemies=[],joyX=0,joyY=0,joyDown=false,last=performance.now();
const $=id=>document.getElementById(id);
function showError(){const e=$('loading');e.innerHTML='❌ Impossible de charger le moteur 3D.<br><small>Actualise la page avec Ctrl+F5.</small>';e.style.fontSize='22px'}
function loadThree(){return new Promise((resolve,reject)=>{if(window.THREE)return resolve();let urls=['https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js','https://unpkg.com/three@0.180.0/build/three.min.js'];let i=0;function next(){if(i>=urls.length)return reject(new Error('Three.js indisponible'));let s=document.createElement('script');s.src=urls[i++];s.onload=()=>window.THREE?resolve():next();s.onerror=next;document.head.appendChild(s)}next()})}
function mat(c,rough=.8){return new THREE.MeshStandardMaterial({color:c,roughness:rough})}
function cube(w,h,d,c,x,y,z,transparent=false){let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;if(transparent){m.material.transparent=true;m.material.opacity=.5}scene.add(m);return m}
function makePlayer(c=0x20c985){let g=new THREE.Group();let b=new THREE.Mesh(new THREE.BoxGeometry(1,1.4,.7),mat(c));b.position.y=1.25;b.castShadow=true;g.add(b);let h=new THREE.Mesh(new THREE.SphereGeometry(.43,16,12),mat(0xffc59b));h.position.y=2.35;h.castShadow=true;g.add(h);let hair=new THREE.Mesh(new THREE.BoxGeometry(.78,.18,.78),mat(0x22252b));hair.position.y=2.72;g.add(hair);for(let x of[-.25,.25]){let l=new THREE.Mesh(new THREE.BoxGeometry(.22,.8,.25),mat(0x20252b));l.position.set(x,.42,0);g.add(l)}return g}
function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0x88b8d1);camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,400);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;$('game').appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x405060,2.3));let l=new THREE.DirectionalLight(0xffffff,3);l.position.set(25,40,20);l.castShadow=true;scene.add(l);bind();$('loading').remove();animate()}
function bind(){addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.code==='Space')jump()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>start(b.dataset.mode));$('back').onclick=lobby;$('jump').onpointerdown=jump;$('attack').onpointerdown=attack;let j=$('joy');j.onpointerdown=e=>{joyDown=true;moveJoy(e)};addEventListener('pointermove',e=>{if(joyDown)moveJoy(e)});addEventListener('pointerup',()=>{joyDown=false;joyX=joyY=0;$('knob').style.transform='translate(-50%,-50%)'})}
function moveJoy(e){let r=$('joy').getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,m=55,d=Math.hypot(x,y);if(d>m){x=x/d*m;y=y/d*m}joyX=x/m;joyY=y/m;$('knob').style.transform='translate(calc(-50% + '+x+'px),calc(-50% + '+y+'px))'}
function clearWorld(){for(let i=scene.children.length-1;i>=0;i--){let o=scene.children[i];if(o.type==='Mesh'||o.type==='Group')scene.remove(o)}enemies=[]}
function start(m){mode=m;alive=true;won=false;vy=0;green=true;clearWorld();$('menu').classList.add('hidden');$('hud').style.display='flex';$('back').style.display='block';$('touch').style.display=m==='dalgona'?'none':'block';$('stage').textContent={sun:'🟢 1, 2, 3 Soleil',glass:'🌉 Pont en verre',dalgona:'🍪 Dalgona',pvp:'⚔️ PvP'}[m];player=makePlayer();scene.add(player);player.position.set(0,0,18);if(m==='sun')sun();if(m==='glass')glass();if(m==='pvp')pvp();if(m==='dalgona')dalgona()}
function sun(){scene.background.set(0x8fc2d9);cube(120,.6,120,0x596861,0,-.3,0);cube(1,7,90,0xffffff,-22,3,0);cube(1,7,90,0xffffff,22,3,0);cube(44,.3,1,0xff315f,0,.1,-38);let d=makePlayer(0xf0d0b0);d.scale.set(1.5,1.5,1.5);d.position.set(0,0,-42);scene.add(d);$('light').textContent='🟢 BOUGE';$('info').textContent='Atteins la ligne !';sunCycle()}
function sunCycle(){if(mode!=='sun')return;setTimeout(()=>{if(mode!=='sun')return;green=!green;$('light').textContent=green?'🟢 BOUGE':'🔴 STOP';sunCycle()},green?2800:2400)}
function glass(){scene.background.set(0x080e1b);cube(100,.6,100,0x151b22,0,-.3,0);cube(12,.7,5,0x777,0,0,23);for(let i=0;i<11;i++){let z=18-i*4.5;cube(3.5,.3,3.8,0x45b9df,-2.25,.1,z,true);cube(3.5,.3,3.8,0x45b9df,2.25,.1,z,true)}cube(12,.7,5,0x777,0,0,-33);$('light').textContent='🌉';$('info').textContent='Une vitre sur deux est sûre !';toast('Choisis gauche ou droite !')}
function pvp(){scene.background.set(0x202a35);cube(100,.6,100,0x3b454e,0,-.3,0);for(let i=0;i<5;i++){let e=makePlayer(0xe91e56);e.position.set((i-2)*5,0,-5-i*4);e.userData.hp=3;scene.add(e);enemies.push(e)}$('light').textContent='⚔️';$('info').textContent='Élimine les adversaires !';toast('Approche et appuie sur ⚔️')}
function attack(){if(mode!=='pvp'||!alive)return;for(let e of [...enemies])if(e.position.distanceTo(player.position)<3){e.userData.hp--;e.position.z-=2;if(e.userData.hp<=0){scene.remove(e);enemies=enemies.filter(x=>x!==e);toast('💥 Adversaire éliminé !')}}}
function dalgona(){let ui=document.createElement('div');ui.id='dalgona';ui.innerHTML='<div class="cookie"><h2>🍪 Trace la forme !</h2><div class="shape"></div><div class="bar"><div class="fill"></div></div></div>';document.body.appendChild(ui);let c=ui.querySelector('.cookie'),f=ui.querySelector('.fill'),p=0;function draw(e){let r=c.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;if(Math.hypot(x-r.width/2,y-r.height/2)<r.width*.43){p=Math.min(1,p+.025);f.style.width=p*100+'%';if(p>=1){ui.remove();toast('🏆 Dalgona réussie !');setTimeout(lobby,1200)}}}c.onpointerdown=draw;c.onpointermove=draw;setTimeout(()=>{if(ui.isConnected){ui.remove();toast('💀 Dalgona ratée !');setTimeout(lobby,1200)}},18000)}
function jump(){if(player&&alive&&grounded){vy=9;grounded=false}}
function move(dt){if(!player||!alive)return;let x=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),z=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);x+=joyX;z+=joyY;let n=Math.hypot(x,z);if(n>1){x/=n;z/=n}player.position.x+=x*8*dt;player.position.z+=z*8*dt;vy-=23*dt;player.position.y+=vy*dt;if(player.position.y<=0){player.position.y=0;vy=0;grounded=true}if(mode==='sun'&&!green&&(Math.abs(x)+Math.abs(z)>.1)){alive=false;toast('💀 ÉLIMINÉ ! Tu as bougé !');setTimeout(lobby,1600)}if(mode==='sun'&&player.position.z<-38&&!won){won=true;toast('🏆 VICTOIRE !');setTimeout(lobby,1600)}if(mode==='glass'){let row=Math.floor((18-player.position.z)/4.5);if(row>=1&&row<=11&&Math.abs(player.position.x)<4){let side=player.position.x<0?-1:1,safe=row%2?-1:1;if(side!==safe){alive=false;player.position.y=-8;toast('💀 MAUVAISE VITRE !');setTimeout(lobby,1600)}else player.position.x=safe*2.25}}if(mode==='pvp')enemies.forEach(e=>{let d=e.position.distanceTo(player.position);if(d<8)e.position.lerp(player.position,dt*.25);if(d<1.7&&Math.random()<dt*.7)toast('💥 Tu prends un coup !')})}
function toast(t){let e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(e.t);e.t=setTimeout(()=>e.style.display='none',2200)}
function lobby(){mode='';alive=false;$('menu').classList.remove('hidden');$('hud').style.display='none';$('back').style.display='none';$('touch').style.display='none';let d=$('dalgona');if(d)d.remove();if(player){scene.remove(player);player=null}clearWorld()}
function animate(){requestAnimationFrame(animate);let now=performance.now(),dt=Math.min((now-last)/1000,.05);last=now;move(dt);if(player){camera.position.lerp(new THREE.Vector3(player.position.x,player.position.y+4.2,player.position.z+9),.09);camera.lookAt(player.position.x,player.position.y+1,player.position.z-2)}renderer.render(scene,camera)}
loadThree().then(init).catch(showError);
</script>
</body></html>

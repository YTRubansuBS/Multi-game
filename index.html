<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Squid Game 3D</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071018;color:#fff;font-family:Arial,sans-serif;touch-action:none}canvas{display:block}#menu{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#26343d,#05080c 75%)}.panel{width:min(92vw,520px);padding:28px;border:2px solid #e31b52;border-radius:24px;background:#0a0e14f5;text-align:center;box-shadow:0 0 50px #e31b5255}.panel h1{font-size:42px;color:#ff315f;margin:0 0 8px}.panel p{color:#cbd3d9}.games{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.btn{border:0;border-radius:14px;padding:16px;font-weight:900;font-size:16px;color:#fff;background:#e31b52;cursor:pointer}.btn.alt{background:#27333e}.btn:hover{filter:brightness(1.15)}#hud{position:fixed;z-index:5;left:14px;top:14px;display:none;flex-direction:column;gap:7px}.badge{background:#071018dd;border:1px solid #ffffff33;border-radius:11px;padding:8px 12px;font-weight:800}#back{position:fixed;right:14px;top:14px;z-index:7;display:none}.hidden{display:none!important}#touch{position:fixed;inset:0;z-index:6;display:none;pointer-events:none}.joy{position:absolute;left:20px;bottom:20px;width:145px;height:145px;border-radius:50%;background:#ffffff18;border:2px solid #ffffff44;pointer-events:auto}.knob{position:absolute;left:50%;top:50%;width:60px;height:60px;transform:translate(-50%,-50%);border-radius:50%;background:#ffffff55;border:2px solid #fff8}.jump,.attack{position:absolute;border-radius:50%;color:white;font-weight:900;pointer-events:auto}.jump{right:22px;bottom:28px;width:105px;height:105px;background:#e31b52dd;border:3px solid #fff8}.attack{right:145px;bottom:27px;width:78px;height:78px;background:#202c38dd;border:2px solid #fff8}.dalgona{position:fixed;inset:0;z-index:20;background:#160e08f5;display:flex;align-items:center;justify-content:center}.cookie{width:min(78vw,420px);height:min(78vw,420px);border-radius:50%;background:#d99a45;box-shadow:inset 0 0 0 12px #b8782d;position:relative;overflow:hidden}.shape{position:absolute;inset:18%;border:5px dashed #5b3517;border-radius:50%;clip-path:polygon(50% 0,61% 34%,98% 35%,69% 57%,79% 100%,50% 72%,21% 100%,31% 57%,2% 35%,39% 34%);pointer-events:none}.dalgona h2{position:absolute;top:20px;text-align:center;width:100%;font-size:22px}.progress{position:absolute;left:12%;right:12%;bottom:25px;height:16px;background:#fff4;border-radius:10px;overflow:hidden}.fill{height:100%;width:100%;background:#4be18a;transform-origin:left}.toast{position:fixed;z-index:30;left:50%;bottom:18px;transform:translateX(-50%);background:#071018ed;padding:12px 18px;border-radius:12px;font-weight:900;display:none}</style></head><body><div id="game"></div><div id="menu"><div class="panel"><h1>🦑 SQUID GAME 3D</h1><p>Choisis ton épreuve. Déplacement clavier ou joystick tactile + saut.</p><div class="games"><button class="btn" onclick="start('sun')">🟢 1, 2, 3 Soleil</button><button class="btn" onclick="start('glass')">🌉 Pont en verre</button><button class="btn" onclick="start('dalgona')">🍪 Dalgona</button><button class="btn" onclick="start('pvp')">⚔️ PvP</button></div></div></div><div id="hud"><div class="badge" id="stage">Épreuve</div><div class="badge" id="info">Prêt</div><div class="badge" id="light">🟢 BOUGE</div></div><button id="back" class="btn alt" onclick="lobby()">☰ Lobby</button><div id="touch"><div class="joy" id="joy"><div class="knob" id="knob"></div></div><button class="attack" onclick="attack()">⚔️</button><button class="jump" onclick="jump()">SAUT</button></div><div id="toast" class="toast"></div><script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script><script>
let scene,camera,renderer,player,mode='';let keys={},velY=0,onGround=true,alive=true,finished=false;let lightGreen=true,round=0;let enemies=[];const clock=new THREE.Clock();
function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0x8fb8d1);scene.fog=new THREE.Fog(0x8fb8d1,35,100);camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,300);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.getElementById('game').appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x445566,2));let sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(20,35,15);sun.castShadow=true;scene.add(sun);window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space')jump()});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);animate()}
function mat(c){return new THREE.MeshStandardMaterial({color:c})}function box(w,h,d,c,x,y,z){let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;scene.add(m);return m}
function makePlayer(c=0x22cc88){let g=new THREE.Group();let body=new THREE.Mesh(new THREE.BoxGeometry(1,1.5,.65),mat(c));body.position.y=1.25;body.castShadow=true;g.add(body);let head=new THREE.Mesh(new THREE.BoxGeometry(.75,.75,.75),mat(0xffc59b));head.position.y=2.4;head.castShadow=true;g.add(head);for(let x of [-.25,.25]){let l=new THREE.Mesh(new THREE.BoxGeometry(.2,.8,.25),mat(0x20252b));l.position.set(x,.4,0);l.castShadow=true;g.add(l)}return g}
function clear(){while(scene.children.length>2)scene.remove(scene.children[2]);enemies=[]}function base(){box(100,.5,100,0x39434c,0,-.3,0);for(let i=-5;i<=5;i++){box(1,6,1,0xeeeeee,-18,3,i*7);box(1,6,1,0xeeeeee,18,3,i*7)}}
function start(m){mode=m;document.getElementById('menu').classList.add('hidden');document.getElementById('hud').style.display='flex';document.getElementById('back').style.display='block';document.getElementById('touch').style.display='block';clear();alive=true;finished=false;round=0;player=makePlayer();scene.add(player);player.position.set(0,0,18);document.getElementById('stage').textContent={sun:'🟢 1, 2, 3 Soleil',glass:'🌉 Pont en verre',dalgona:'🍪 Dalgona',pvp:'⚔️ PvP'}[m];if(m==='sun')sunGame();if(m==='glass')glassGame();if(m==='pvp')pvpGame();if(m==='dalgona')dalgonaGame()}
function sunGame(){base();box(42,.2,1,0xffffff,0,.1,-30);box(42,.2,1,0xff315f,0,.1,30);let doll=makePlayer(0xffd7c1);doll.scale.set(1.3,1.3,1.3);doll.position.set(0,0,-32);scene.add(doll);lightGreen=true;setTimeout(()=>{if(mode==='sun')toggleSun()},2500)}
function toggleSun(){lightGreen=!lightGreen;document.getElementById('light').textContent=lightGreen?'🟢 BOUGE':'🔴 STOP';if(!lightGreen)round++;if(mode==='sun')setTimeout(toggleSun,3000)}
function glassGame(){scene.background=new THREE.Color(0x0b1020);for(let i=0;i<10;i++){let z=-i*5;box(3,.35,4,0x4aa3c7,-2,0,z);box(3,.35,4,0x4aa3c7,2,0,z)}box(10,.5,5,0x777777,0,0,7);toast('Choisis gauche ou droite : une seule dalle est sûre !')}
function dalgonaGame(){let ui=document.createElement('div');ui.className='dalgona';ui.innerHTML='<div class="cookie"><h2>🍪 Trace la forme sans sortir !</h2><div class="shape"></div><div class="progress"><div class="fill"></div></div></div>';document.body.appendChild(ui);let fill=ui.querySelector('.fill'),cookie=ui.querySelector('.cookie'),startT=Date.now(),p=0,draw=e=>{let r=cookie.getBoundingClientRect(),x=(e.touches?e.touches[0].clientX:e.clientX)-r.left,y=(e.touches?e.touches[0].clientY:e.clientY)-r.top,c=r.width/2,dx=x-c,dy=y-c;if(Math.sqrt(dx*dx+dy*dy)<r.width*.42){p=Math.min(1,p+.018);fill.style.width=(100*p)+'%';if(p>=1){ui.remove();toast('🍪 Dalgona réussie !');mode='sun';start('sun')}}};cookie.addEventListener('pointermove',draw);cookie.addEventListener('pointerdown',draw);setTimeout(()=>{if(document.body.contains(ui)){ui.remove();toast('💀 Temps écoulé !');lobby()}},15000)}
function pvpGame(){base();player.position.set(0,0,12);for(let i=0;i<4;i++){let e=makePlayer(0xe31b52);e.position.set((i-1.5)*5,0,-8-i*5);e.userData.hp=3;scene.add(e);enemies.push(e)}toast('⚔️ Approche les adversaires et attaque !')}
function attack(){if(mode!=='pvp'||!alive)return;for(let e of enemies){if(e.position.distanceTo(player.position)<3){e.userData.hp--;e.position.z-=2;if(e.userData.hp<=0){scene.remove(e);enemies=enemies.filter(x=>x!==e);toast('💥 Adversaire éliminé !')}}}}
function jump(){if(onGround&&alive){velY=9;onGround=false}}
function movement(dt){if(!player||!alive)return;let x=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);let z=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);x+=joyX;z+=joyY;let len=Math.hypot(x,z);if(len>1){x/=len;z/=len}player.position.x+=x*8*dt;player.position.z+=z*8*dt;velY-=22*dt;player.position.y+=velY*dt;if(player.position.y<=0){player.position.y=0;velY=0;onGround=true}if(mode==='sun'&&!lightGreen&&(Math.abs(x)+Math.abs(z)>.12)){alive=false;toast('💀 ÉLIMINÉ ! Tu as bougé au feu rouge.');setTimeout(lobby,1800)}if(mode==='sun'&&player.position.z<-28&&!finished){finished=true;toast('🏆 VICTOIRE !');setTimeout(lobby,1800)}if(mode==='glass'){let row=Math.round(-player.position.z/5),side=player.position.x<0?-1:1;if(row>=1&&row<=10&&Math.abs(player.position.x)<4){let safe=(row%2===0?1:-1);if(side===safe){player.position.x=safe*2}else{alive=false;player.position.y=-8;toast('💀 Mauvaise vitre !');setTimeout(lobby,1800)}}}if(mode==='pvp')enemies.forEach(e=>{let d=e.position.distanceTo(player.position);if(d<8){e.position.lerp(player.position,dt*.18);if(d<1.6&&Math.random()<dt*.8){toast('💥 Tu prends un coup !')}}})}
let joyX=0,joyY=0,joyActive=false;const joy=document.getElementById('joy'),knob=document.getElementById('knob');function joyMove(e){let r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,x=(e.touches?e.touches[0].clientX:e.clientX)-cx,y=(e.touches?e.touches[0].clientY:e.clientY)-cy,max=55,d=Math.hypot(x,y);if(d>max){x=x/d*max;y=y/d*max}joyX=x/max;joyY=y/max;knob.style.transform='translate(calc(-50% + '+x+'px),calc(-50% + '+y+'px))'}joy.addEventListener('pointerdown',e=>{joyActive=true;joyMove(e)});window.addEventListener('pointermove',e=>{if(joyActive)joyMove(e)});window.addEventListener('pointerup',()=>{joyActive=false;joyX=joyY=0;knob.style.transform='translate(-50%,-50%)'});
function toast(t){let el=document.getElementById('toast');el.textContent=t;el.style.display='block';clearTimeout(el._t);el._t=setTimeout(()=>el.style.display='none',2200)}function lobby(){mode='';document.getElementById('menu').classList.remove('hidden');document.getElementById('hud').style.display='none';document.getElementById('back').style.display='none';document.getElementById('touch').style.display='none';if(player)scene.remove(player);clear()}function animate(){requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.05);movement(dt);if(player){let target=new THREE.Vector3(player.position.x,player.position.y+4,player.position.z+9);camera.position.lerp(target,.08);camera.lookAt(player.position.x,player.position.y+1,player.position.z-2)}renderer.render(scene,camera)}init();</script></body></html>

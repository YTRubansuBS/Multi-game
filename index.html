<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Squid Game 3D</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;color:white;font-family:Arial}#loading{position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;background:#101820;font-size:24px;font-weight:bold}#menu{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#101820,#35111e,#080b10);padding:15px}.panel{width:min(94vw,600px);padding:30px;border:2px solid #ff315f;border-radius:25px;background:#090d13f5;text-align:center;box-shadow:0 0 60px #ff315f44}.logo{font-size:48px;color:#ff315f}.games{display:grid;grid-template-columns:1fr 1fr;gap:14px}.btn{border:0;border-radius:15px;padding:17px;color:white;background:#e91e56;font-size:16px;font-weight:bold;cursor:pointer}.dark{background:#293641}.help{margin-top:20px;padding:13px;border-radius:12px;background:#17212a;color:#bdc8cf}#game{position:fixed;inset:0}#hud{position:fixed;z-index:8;left:12px;top:12px;display:none;gap:7px;flex-direction:column}.badge{background:#071018e8;border:1px solid #fff3;border-radius:12px;padding:9px 13px;font-weight:bold}#back{position:fixed;right:12px;top:12px;z-index:9;display:none}#touch{position:fixed;inset:0;z-index:9;display:none;pointer-events:none}#joy{position:absolute;left:20px;bottom:20px;width:150px;height:150px;border-radius:50%;background:#fff2;border:2px solid #fff5;pointer-events:auto}#knob{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px;border-radius:50%;background:#fff7}#jump,#attack{position:absolute;border:2px solid #fff9;border-radius:50%;color:white;font-weight:bold;pointer-events:auto}#jump{right:20px;bottom:25px;width:110px;height:110px;background:#e91e56e8}#attack{right:145px;bottom:28px;width:78px;height:78px;background:#273641e8}#toast{position:fixed;z-index:20;left:50%;bottom:185px;transform:translateX(-50%);display:none;background:#071018ed;padding:13px 18px;border-radius:12px;font-weight:bold;text-align:center}.hidden{display:none!important}</style></head><body><div id="loading">🦑 Initialisation du jeu...</div><div id="game"></div><div id="menu"><div class="panel"><h1 class="logo">🦑 SQUID GAME 3D</h1><p>Choisis ton épreuve</p><div class="games"><button class="btn" onclick="start('sun')">🟢 1, 2, 3 Soleil</button><button class="btn" onclick="start('glass')">🌉 Pont en verre</button><button class="btn" onclick="start('dalgona')">🍪 Dalgona</button><button class="btn" onclick="start('pvp')">⚔️ PvP</button></div><div class="help">💻 PC : WASD / flèches + ESPACE<br>📱 Mobile : joystick + SAUT</div></div></div><div id="hud"><div class="badge" id="stage">Épreuve</div><div class="badge" id="info">Prêt</div><div class="badge" id="light">🟢 BOUGE</div></div><button id="back" class="btn dark" onclick="lobby()">☰ LOBBY</button><div id="touch"><div id="joy"><div id="knob"></div></div><button id="attack" onclick="attack()">⚔️</button><button id="jump" onclick="jump()">SAUT</button></div><div id="toast"></div><script>(function(){var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js';s.onload=function(){if(window.THREE) init3D();else fallback()};s.onerror=fallback;document.head.appendChild(s);setTimeout(function(){if(!window.THREE&&!window.__ready)fallback()},5000)})();function fallback(){if(window.__ready)return;window.__ready=true;document.getElementById('loading').innerHTML='⚠️ Le moteur 3D externe ne se charge pas.<br><small>Le navigateur bloque probablement Three.js.</small>';document.getElementById('loading').style.textAlign='center'}function init3D(){window.__ready=true;var scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,300),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;document.getElementById('game').appendChild(renderer.domElement);scene.background=new THREE.Color(0x83b7cf);scene.add(new THREE.HemisphereLight(0xffffff,0x405060,2));var dl=new THREE.DirectionalLight(0xffffff,3);dl.position.set(20,35,15);scene.add(dl);var player;window.mode='';window.alive=true;function box(w,h,d,c,x,y,z){var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:c}));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m}function person(c){var g=new THREE.Group(),b=new THREE.Mesh(new THREE.BoxGeometry(1,1.4,.7),new THREE.MeshStandardMaterial({color:c}));b.position.y=1.25;g.add(b);var h=new THREE.Mesh(new THREE.SphereGeometry(.43,16,12),new THREE.MeshStandardMaterial({color:0xffc59b}));h.position.y=2.35;g.add(h);var l1=box(.22,.8,.25,0x22252b,-.25,.4,0),l2=box(.22,.8,.25,0x22252b,.25,.4,0);scene.remove(l1,l2);g.add(l1,l2);return g}var keys={},vy=0,ground=true,last=performance.now();window.start=function(m){mode=m;alive=true;document.getElementById('menu').classList.add('hidden');document.getElementById('hud').style.display='flex';document.getElementById('back').style.display='block';document.getElementById('touch').style.display=m==='dalgona'?'none':'block';document.getElementById('stage').textContent={sun:'🟢 1, 2, 3 Soleil',glass:'🌉 Pont en verre',dalgona:'🍪 Dalgona',pvp:'⚔️ PvP'}[m];while(scene.children.length>2)scene.remove(scene.children[2]);player=person(0x20c985);scene.add(player);player.position.set(0,0,15);box(80,.5,100,0x4d585f,0,-.25,0);document.getElementById('info').textContent=m==='sun'?'Atteins la ligne !':m==='glass'?'Une vitre sur deux est sûre !':m==='pvp'?'Élimine les ennemis !':'Trace la forme !';if(m==='sun'){box(45,.3,1,0xff315f,0,.1,-35);var doll=person(0xf0d0b0);doll.scale.set(1.5,1.5,1.5);doll.position.set(0,0,-39);scene.add(doll)}if(m==='glass'){scene.background.set(0x080e1b);for(var i=0;i<9;i++){var z=12-i*4.5;box(3.5,.25,3.8,0x45b9df,-2.25,.1,z);box(3.5,.25,3.8,0x45b9df,2.25,.1,z)}}if(m==='pvp'){for(var j=0;j<5;j++){var e=person(0xe91e56);e.position.set((j-2)*4,0,-5-j*3);e.userData.hp=2;scene.add(e)}}};window.lobby=function(){mode='';alive=false;document.getElementById('menu').classList.remove('hidden');document.getElementById('hud').style.display='none';document.getElementById('back').style.display='none';document.getElementById('touch').style.display='none'};window.jump=function(){if(player&&alive&&ground){vy=9;ground=false}};window.attack=function(){if(mode!=='pvp'||!player)return;scene.children.slice().forEach(function(e){if(e.userData&&e.userData.hp&&e.position.distanceTo(player.position)<3){e.userData.hp--;if(e.userData.hp<=0)scene.remove(e)}})};addEventListener('keydown',function(e){keys[e.key.toLowerCase()]=1;if(e.code==='Space')jump()});addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=0});var joyX=0,joyY=0,down=false;var joy=document.getElementById('joy');joy.onpointerdown=function(e){down=true;joyMove(e)};addEventListener('pointermove',function(e){if(down)joyMove(e)});addEventListener('pointerup',function(){down=false;joyX=joyY=0;document.getElementById('knob').style.transform='translate(-50%,-50%)'});function joyMove(e){var r=joy.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,m=55,d=Math.hypot(x,y);if(d>m){x=x/d*m;y=y/d*m}joyX=x/m;joyY=y/m;document.getElementById('knob').style.transform='translate(calc(-50% + '+x+'px),calc(-50% + '+y+'px))'}function toast(t){var e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(function(){e.style.display='none'},1800)}function loop(){requestAnimationFrame(loop);var now=performance.now(),dt=Math.min((now-last)/1000,.05);last=now;if(player&&alive){var x=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joyX,z=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+joyY,n=Math.hypot(x,z);if(n>1){x/=n;z/=n}player.position.x+=x*8*dt;player.position.z+=z*8*dt;vy-=23*dt;player.position.y+=vy*dt;if(player.position.y<=0){player.position.y=0;vy=0;ground=true}if(mode==='sun'&&player.position.z<-33){toast('🏆 VICTOIRE !');alive=false;setTimeout(lobby,1500)}if(mode==='pvp')scene.children.forEach(function(e){if(e.userData&&e.userData.hp){var d=e.position.distanceTo(player.position);if(d<9)e.position.lerp(player.position,dt*.2)}})}if(player){camera.position.lerp(new THREE.Vector3(player.position.x,player.position.y+4.5,player.position.z+9),.1);camera.lookAt(player.position.x,player.position.y+1,player.position.z-2)}renderer.render(scene,camera)}loop();document.getElementById('loading').remove()}if(window.WebGLRenderingContext===undefined)fallback();})();</script></body></html>

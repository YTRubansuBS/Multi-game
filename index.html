<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Multi-game • Messages</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#07111b;color:#fff}button,input{font:inherit}button{cursor:pointer}.hide{display:none!important}#login{min-height:100%;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 0,#263b62,#07111b 60%)}.login-card{width:min(560px,96vw);background:#0d1725f5;border:1px solid #ffffff18;border-radius:26px;padding:30px;box-shadow:0 25px 90px #000b;text-align:center}.logo{font-size:42px;font-weight:900}.sub{color:#9aa8bc}.accounts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}.account{border:1px solid #ffffff14;border-radius:18px;padding:18px;background:#142135;color:#fff;text-align:center}.account:hover{background:#1d2e49}.avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#5865f2,#c64cf0);font-weight:900}.account .avatar{margin:auto auto 8px}.login-form{margin-top:18px;padding:16px;background:#ffffff08;border-radius:16px;text-align:left}.login-form label{font-size:13px;color:#9aa8bc}.login-form input{margin-top:7px}.input{width:100%;padding:13px;border-radius:11px;border:1px solid #ffffff18;background:#080f18;color:#fff;outline:none}.login-btn{width:100%;margin-top:10px;border:0;border-radius:11px;padding:13px;background:#5865f2;color:#fff;font-weight:bold}.error{height:20px;color:#ff718f;font-size:13px;margin-top:7px}.hint{font-size:12px;color:#78879c;margin-top:16px}#app{height:100%;display:flex;flex-direction:column}header{height:62px;flex:none;display:flex;align-items:center;padding:9px 14px;background:#0a121e;border-bottom:1px solid #ffffff10}.brand{font-weight:900;font-size:20px}.me{margin-left:auto;display:flex;align-items:center;gap:8px}.mini{width:34px;height:34px}.head-btn,.icon-btn{border:1p und:#1b2a3e;color:#fff}.send{border:0;border-radius:12px;background:#5865f2;color:#fff;padding:11px 15px;font-weight:bold}.context{position:fixed;z-index:50;width:210px;background:#101a29;border:1px solid #ffffff1d;border-radius:14px;box-shadow:0 20px 70px #000b;padding:6px}.context button{display:block;width:100%;border:0;background:transparent;color:#fff;text-align:left;padding:10px;border-radius:8px}.context button:hover{background:#ffffff0d}.reply-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#111d2c;border-top:1px solid #ffffff0d}.reply-bar div{flex:1;font-size:12px;color:#aebbd0}.reply-bar button{border:0;background:transparent;color:#fff}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:60;padding:18px}.modal-card{width:min(500px,95vw);max-height:85vh;overflow:auto;background:#101a29;border:1px solid #ffffff18;border-radius:20px;padding:20px}.modal-card h2{margin-top:0}.check{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px}.check:hover{background:#ffffff08}.check .avatar{width:34px;height:34px}.modal-actions{display:flex;gap:8px;margin-top:14px}.modal-actions button{flex:1;border:0;border-radius:10px;padding:11px}.ok{background:#5865f2;color:#fff}.cancel{background:#263349;color:#fff}#incoming{position:fixed;z-index:70;top:14px;left:50%;transform:translateX(-50%);width:min(390px,92vw);background:#101a29;border:1px solid #ffffff22;border-radius:17px;padding:15px;box-shadow:0 20px 80px #000}.incoming-buttons{display:flex;gap:8px;margin-top:10px}.incoming-buttons button{flex:1;border:0;border-radius:10px;padding:11px;font-weight:bold}.accept{background:#25c889;color:#fff}.decline{background:#d83b5d;color:#fff}#call{position:fixed;right:15px;bottom:15px;width:min(540px,calc(100vw - 30px));z-index:65;background:#0b1421f7;border:1px solid #ffffff20;border-radius:19px;overflow:hidden;box-shadow:0 25px 90px #000b}.call-head{display:flex;padding:12px;border-bottom:1px solid #ffffff10}.call-info{flex:1}.call-state{font-size:12px;color:#8290a5}.videos{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:9px}.videos video{width:100%;aspect-ratio:16/10;background:#000;border-radius:12px;object-fit:cover}.call-controls{display:flex;gap:7px;padding:0 9px 9px}.call-controls button{flex:1;border:0;border-radius:10px;padding:10px;background:#263349;color:#fff;font-weight:bold}.call-controls .hang{background:#d9365b}#toast{position:fixed;z-index:100;bottom:18px;left:50%;transform:translateX(-50%);background:#121e2e;border:1px solid #ffffff18;border-radius:12px;padding:11px 15px;display:none}@media(max-width:760px){header{height:58px}.sidebar{width:100%}.chat{display:none}.chat.mobile{display:flex;position:absolute;inset:58px 0 0}.sidebar.mobile{display:none}.msg{max-width:88%}.login-card{padding:22px}}

<div id="login"><div class="login-card"><div class="logo">💬 Multi-game</div><div class="sub">Choisis ton compte</div><div class="accounts" id="accounts"></div><div id="loginForm" class="login-form hide"><label>Mot de passe de <b id="selectedName"></b></label><input id="password" class="input" type="password" autocomplete="current-password" placeholder="Entre le mot de passe"><button id="loginBtn" class="login-btn">Se connecter</button><div id="loginError" class="error"></div></div><div class="hint">Mot de passe : le nom du compte. Exemple : Ruben → Ruben.</div></div></div>

<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script><script>
const USERS=['Naim','Ilan','Juul','Ruben'],PASS={Naim:'Naim',Ilan:'Ilan',Juul:'Juul',Ruben:'Ruben'};const $=id=>document.getElementById(id),initials=n=>n.slice(0,2).toUpperCase(),pair=(a,b)=>[a,b].sort().join('__');let me='',selected='',active='',peer=null,connections={},messages={},groups=[],replyTo=null,call=null,stream=null,incoming=null,unread={};try{messages=JSON.parse(localStorage.getItem('mg_messages')||'{}');groups=JSON.parse(localStorage.getItem('mg_groups')||'[]')}catch(e){}const save=()=>{localStorage.setItem('mg_messages',JSON.stringify(messages));localStorage.setItem('mg_groups',JSON.stringify(groups))};function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').style.display='none',2300)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function avatar(n){return '<span class="avatar">'+esc(initials(n))+'</span>'}
function renderAccounts(){$('accounts').innerHTML=USERS.map(n=>'<button class="account" data-user="'+n+'">'+avatar(n)+'<b>'+n+'</b></button>').join('');document.querySelectorAll('.account').forEach(b=>b.onclick=()=>selectAccount(b.dataset.user))}function selectAccount(n){selected=n;$('selectedName').textContent=n;$('loginForm').classList.remove('hide');$('loginError').textContent='';$('password').value='';setTimeout(()=>$('password').focus(),50)}function doLogin(){if(!selected)return;if($('password').value!==PASS[selected]){$('loginError').textContent='❌ Mot de passe incorrect.';$('password').select();return}me=selected;$('login').classList.add('hide');$('app').classList.remove('hide');$('myName').textContent=me;$('myAvatar').textContent=initials(me);renderContacts();initPeer()}$('loginBtn').onclick=doLogin;$('password').onkeydown=e=>{if(e.key==='Enter')doLogin()};
function initPeer(){if(!window.Peer)return toast('Service d’appel indisponible');if(peer)return;peer=new Peer(me.toLowerCase(),{config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun.cloudflare.com:3478'}]}});peer.on('open',()=>{toast('Connecté ✓');pingAll()});peer.on('connection',c=>setupConnection(c));peer.on('call',c=>receiveCall(c));peer.on('error',e=>{if(e.type==='unavailable-id')toast('⚠️ Ce compte est déjà connecté dans un autre onglet')});setInterval(pingAll,8000)}function setupConnection(c){const n=c.peer[0].toUpperCase()+c.peer.slice(1);connections[n]=c;c.on('open',()=>{c.send({t:'hello'});online(n,true)});c.on('data',d=>{if(!d)return;if(d.t==='hello')online(n,true);if(d.t==='msg')receiveMessage(n,d.message,d.group);if(d.t==='edit')applyRemoteEdit(d);if(d.t==='delete')applyRemoteDelete(d);if(d.t==='group'&&d.group&&!groups.some(g=>g.id===d.group.id)){groups.push(d.group);save();renderContacts()}});c.on('close',()=>{if(connections[n]===c)delete connections[n];online(n,false)})}function pingAll(){if(!peer||peer.destroyed)return;USERS.filter(n=>n!==me).forEach(n=>{const c=peer.connect(n.toLowerCase(),{reliable:true});let done=false;const timer=setTimeout(()=>{if(!done){done=true;try{c.close()}catch(e){}online(n,false)}},1700);c.on('open',()=>{if(done)return;done=true;clearTimeout(timer);setupConnection(c);online(n,true)});c.on('error',()=>{if(!done){done=true;clearTimeout(timer);online(n,false)}})})}function online(n,on){const el=$('state_'+n);if(el){el.textContent=on?'En ligne':'Hors ligne';el.className='status '+(on?'online':'')}}
function isGroup(id){return id.startsWith('group_')}function getGroup(id){return groups.find(g=>g.id===id)}function membersOf(id){return isGroup(id)?(getGroup(id)?.members||[]):[id]}function renderContacts(){const q=($('search').value||'').toLowerCase();let html=USERS.filter(n=>n!==me&&n.toLowerCase().includes(q)).map(n=>'<button class="contact '+(active===n?'active':'')+'" data-target="'+n+'">'+avatar(n)+'<span class="contact-info"><b>'+n+'</b><span id="state_'+n+'" class="status">Hors ligne</span></span>'+(unread[n]?'<span class="unread">'+unread[n]+'</span>':'')+'</button>').join('');groups.filter(g=>(g.name||'').toLowerCase().includes(q)&&g.members.includes(me)).forEach(g=>{html+='<button class="contact '+(active===g.id?'active':'')+'" data-target="'+g.id+'">'+avatar(g.name)+'<span class="contact-info"><b>'+esc(g.name)+'</b><span class="status">Groupe • '+g.members.length+' membres</span></span></button>'});$('contacts').innerHTML=html;document.querySelectorAll('.contact').forEach(b=>b.onclick=()=>openChat(b.dataset.target))}$('search').oninput=renderContacts;
function openChat(id){active=id;unread[id]=0;renderContacts();$('sidebar').classList.add('mobile');$('chat').classList.add('mobile');renderChat()}function chatTitle(id){if(isGroup(id)){const g=getGroup(id);return{name:g?.name||'Groupe',sub:(g?.members||[]).join(', ')}}return{name:id,sub:'Messages'}}function getMsgs(id){messages[id]??=[];return messages[id]}
function renderChat(){if(!active)return;$('chat').innerHTML='';const t=chatTitle(active),group=isGroup(active);$('chat').innerHTML='<div class="chat-head">'+avatar(t.name)+'<div class="chat-title"><b>'+esc(t.name)+'</b><span class="status">'+esc(t.sub)+'</span></div><div class="chat-actions">'+(!group?'<button class="icon-btn" id="audio">📞</button><button class="icon-btn" id="video">📹</button>':'')+'<button class="icon-btn" id="back">←</button></div></div><div id="messages" class="messages"></div><div id="replyBar"></div><form id="composer" class="composer"><button type="button" class="round" id="emoji">😊</button><input id="text" class="input" autocomplete="off" placeholder="Écrire un message…"><button class="send">Envoyer</button></form>';const box=$('messages');getMsgs(active).forEach(m=>drawMessage(m,box));box.scrollTop=box.scrollHeight;$('composer').onsubmit=e=>{e.preventDefault();sendMessage($('text').value)};$('emoji').onclick=()=>{$('text').value+=' 😊';$('text').focus()};$('back').onclick=()=>{$('sidebar').classList.remove('mobile');$('chat').classList.remove('mobile');active='';renderContacts()};if(!group){$('audio').onclick=()=>startCall(active,false);$('video').onclick=()=>startCall(active,true)}renderReplyBar()}
function drawMessage(m,box){const d=document.createElement('div');d.className='msg '+(m.from===me?'mine':'');d.dataset.id=m.id;let reply=m.reply?'<div class="reply-preview"><b>'+esc(m.reply.from)+'</b><br>'+esc(m.reply.text)+'</div>':'';d.innerHTML=reply+'<div>'+esc(m.text)+(m.edited?' <span class="edited">(modifié)</span>':'')+'</div><div class="msg-meta">'+esc(m.from)+' • '+new Date(m.time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+'</div>';d.oncontextmenu=e=>{e.preventDefault();showContext(e.clientX,e.clientY,m)};box.appendChild(d)}
function sendMessage(text){text=text.trim();if(!text||!active)return;const m={id:(crypto.randomUUID?crypto.randomUUID():Date.now()+'_'+Math.random()),from:me,text,time:Date.now()};if(replyTo)m.reply={from:replyTo.from,text:replyTo.text};getMsgs(active).push(m);save();broadcast(active,{t:'msg',message:m,group:active});replyTo=null;renderChat()}function broadcast(id,data){membersOf(id).filter(n=>n!==me).forEach(n=>{let c=connections[n];if(!c?.open){try{c=peer.connect(n.toLowerCase(),{reliable:true});setupConnection(c)}catch(e){}}if(c?.open)c.send(data);else c?.on('open',()=>c.send(data))})}function receiveMessage(from,m,group){const id=group||from;getMsgs(id).push(m);save();if(active===id)renderChat();else{unread[id]=(unread[id]||0)+1;renderContacts();toast('💬 Nouveau message de '+from)}}
function showContext(x,y,m){const c=$('context');c.innerHTML='<button data-a="reply">↩️ Répondre</button><button data-a="forward">↪️ Transférer</button>'+(m.from===me?'<button data-a="edit">✏️ Modifier</button>':'')+'<button data-a="copy">📋 Copier</button><button data-a="delete">🗑️ Supprimer</button>';c.style.left=Math.min(x,innerWidth-220)+'px';c.style.top=Math.min(y,innerHeight-250)+'px';c.classList.remove('hide');c.querySelectorAll('button').forEach(b=>b.onclick=()=>contextAction(b.dataset.a,m))}function contextAction(a,m){$('context').classList.add('hide');if(a==='reply'){replyTo=m;renderReplyBar();$('text')?.focus();return}if(a==='copy'){navigator.clipboard?.writeText(m.text);toast('Message copié');return}if(a==='edit'){const n=prompt('Modifier le message :',m.text);if(n!==null&&n.trim()&&m.from===me){m.text=n.trim();m.edited=true;save();broadcast(active,{t:'edit',id:m.id,text:m.text,group:active});renderChat()}return}if(a==='delete'){if(!confirm('Supprimer ce message ?'))return;let arr=getMsgs(active),i=arr.findIndex(x=>x.id===m.id);if(i>=0){arr.splice(i,1);save();broadcast(active,{t:'delete',id:m.id,group:active});renderChat()}return}if(a==='forward')openForward(m)}function applyRemoteEdit(d){for(const id of Object.keys(messages)){const m=messages[id].find(x=>x.id===d.id);if(m){m.text=d.text;m.edited=true}}save();if(active===d.group)renderChat()}function applyRemoteDelete(d){if(d.group&&messages[d.group])messages[d.group]=messages[d.group].filter(m=>m.id!==d.id);else for(const id of Object.keys(messages))messages[id]=messages[id].filter(m=>m.id!==d.id);save();if(active)renderChat()}
function renderReplyBar(){const r=$('replyBar');if(!r)return;r.innerHTML=replyTo?'<div class="reply-bar"><div>↩️ Réponse à <b>'+esc(replyTo.from)+'</b><br>'+esc(replyTo.text)+'</div><button id="cancelReply">✕</button></div>':'';$('cancelReply')?.addEventListener('click',()=>{replyTo=null;renderReplyBar()})}
function openForward(m){$('forwardModal').classList.remove('hide');$('forwardList').innerHTML=USERS.filter(n=>n!==me).map(n=>'<button class="contact" data-f="'+n+'">'+avatar(n)+'<span><b>'+n+'</b></span></button>').join('')+groups.filter(g=>g.members.includes(me)).map(g=>'<button class="contact" data-f="'+g.id+'">'+avatar(g.name)+'<span><b>'+esc(g.name)+'</b></span></button>').join('');document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{const id=b.dataset.f,nm=chatTitle(id).name,copy={id:(crypto.randomUUID?crypto.randomUUID():Date.now()+'f'),from:me,text:'↪️ '+m.text,time:Date.now()};getMsgs(id).push(copy);save();broadcast(id,{t:'msg',message:copy,group:id});$('forwardModal').classList.add('hide');toast('Message transféré')})}$('closeForward').onclick=()=>$('forwardModal').classList.add('hide');
$('newGroup').onclick=()=>{$('groupMembers').innerHTML=USERS.filter(n=>n!==me).map(n=>'<label class="check"><input type="checkbox" value="'+n+'"> '+avatar(n)+' <b>'+n+'</b></label>').join('');$('groupName').value='';$('groupModal').classList.remove('hide')};$('closeGroup').onclick=()=>$('groupModal').classList.add('hide');$('createGroup').onclick=()=>{const mem=[me,...[...document.querySelectorAll('#groupMembers input:checked')].map(x=>x.value)];if(mem.length<2)return toast('Choisis au moins une personne');const name=$('groupName').value.trim()||mem.filter(n=>n!==me).join(', '),g={id:'group_'+Date.now(),name,members:mem};groups.push(g);save();$('groupModal').classList.add('hide');active=g.id;renderContacts();renderChat();broadcast(g.id,{t:'group',group:g})};window.addEventListener('click',e=>{if(!$('context').contains(e.target))$('context').classList.add('hide')});
async function startCall(n,video){if(call)return toast('Tu es déjà en appel');if(!peer)return toast('Connexion au service d’appel…');try{stream=await navigator.mediaDevices.getUserMedia({audio:true,video:video})}catch(e){return toast('Autorise le micro'+(video?' et la caméra':'')+' pour appeler')}call=peer.call(n.toLowerCase(),stream,{metadata:{from:me,video}});showCall(n,video,'Appel en cours…');wireCall(call)}function receiveCall(c){if(call||incoming){c.close();return}incoming=c;const n=c.metadata?.from||c.peer[0].toUpperCase()+c.peer.slice(1);$('incName').textContent=n;$('incType').textContent=c.metadata?.video?'Appel vidéo':'Appel audio';$('incoming').classList.remove('hide');$('accept').onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({audio:true,video:!!c.metadata?.video});call=c;incoming=null;$('incoming').classList.add('hide');showCall(n,!!c.metadata?.video,'Connexion…');wireCall(c);c.answer(stream)}catch(e){c.close();resetCall()}};$('decline').onclick=()=>{c.close();incoming=null;$('incoming').classList.add('hide')}}function showCall(n,v,s){$('callName').textContent=n;$('callState').textContent=s;$('call').classList.remove('hide');$('local').srcObject=stream;$('remote').srcObject=null;$('cam').style.display=v?'block':'none'}function wireCall(c){c.on('stream',s=>{$('remote').srcObject=s;$('callState').textContent='Connecté'});c.on('close',resetCall);c.on('error',resetCall)}function resetCall(){try{stream?.getTracks().forEach(t=>t.stop())}catch(e){}stream=null;call=null;incoming=null;$('call').classList.add('hide');$('remote').srcObject=null;$('local').srcObject=null}$('hang').onclick=()=>{try{call?.close()}catch(e){}resetCall()};$('mute').onclick=()=>{const t=stream?.getAudioTracks()[0];if(t){t.enabled=!t.enabled;$('mute').textContent=t.enabled?'🎙️ Micro':'🔇 Micro coupé'}};$('cam').onclick=()=>{const t=stream?.getVideoTracks()[0];if(t)t.enabled=!t.enabled};$('hideCall').onclick=()=>$('call').classList.add('hide');$('logout').onclick=()=>{try{call?.close();peer?.destroy()}catch(e){}resetCall();me='';peer=null;connections={};$('app').classList.add('hide');$('login').classList.remove('hide');$('loginForm').classList.add('hide');selected=''};window.addEventListener('beforeunload',()=>{try{call?.close();peer?.destroy()}catch(e){}});renderAccounts();
</script></body></html>

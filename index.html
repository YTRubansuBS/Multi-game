<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Squid Game 3D Ultra</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b;color:#fff;font-family:Arial,sans-serif;touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}.hidden{display:none!important}#menu{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,#361322 0,#100b12 45%,#030407 100%);padding:16px}.menuBox{width:min(94vw,760px);padding:34px;border:1px solid #ff416d66;border-radius:28px;background:#080b12eF;box-shadow:0 0 100px #ff174855,0 25px 80px #000;backdrop-filter:blur(14px);text-align:center}.logo{font-size:clamp(38px,7vw,72px);letter-spacing:5px;margin:0;color:#fff;text-shadow:0 0 25px #ff285c}.sub{color:#aeb8c7;margin:8px 0 25px}.games{display:grid;grid-template-columns:1fr 1fr;gap:16px}.gameBtn{position:relative;min-height:105px;border:1px solid #ffffff18;border-radius:20px;background:linear-gradient(145deg,#171d27,#0c1018);color:#fff;font-size:17px;font-weight:900;cursor:pointer;overflow:hidden;box-shadow:inset 0 1px #fff1,0 10px 30px #0008;transition:.18s}.gameBtn:hover{transform:translateY(-4px);border-color:#ff416d88;box-shadow:0 12px 35px #ff174822}.gameBtn:active{transform:scale(.97)}.gameBtn b{display:block;font-size:34px;margin-bottom:6px}.pink{color:#ff416d}.cyan{color:#54dfff}.gold{color:#ffd45a}.violet{color:#b68cff}.help{margin-top:18px;padding:14px;border-radius:15px;background:#ffffff08;border:1px solid #ffffff10;color:#9da8b8;line-height:1.6}#hud{position:fixed;z-index:15;left:14px;top:14px;display:none;gap:8px;flex-wrap:wrap;max-width:75%}.badge{padding:10px 14px;border:1px solid #fff2;border-radius:13px;background:#060a11dd;box-shadow:0 5px 20px #0008;font-weight:900;backdrop-filter:blur(8px)}#back{position:fixed;z-index:16;right:14px;top:14px;display:none;padding:12px 17px;border:1px solid #fff2;border-radius:13px;background:#090d14e8;color:#fff;font-weight:900}#touch{position:fixed;inset:0;z-index:14;display:none;pointer-events:none}.joy{position:absolute;left:22px;bottom:24px;width:155px;height:155px;border-radius:50%;background:#ffffff0c;border:2px solid #ffffff2b;box-shadow:inset 0 0 30px #0008;pointer-events:auto}.knob{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px;border-radius:50%;background:#ffffff22;border:2px solid #fff7;box-shadow:0 5px 25px #0008}.action{position:absolute;border:1px solid #fff5;border-radius:50%;color:#fff;font-weight:900;pointer-events:auto;box-shadow:0 8px 25px #0008}.jump{right:24px;bottom:28px;width:108px;height:108px;background:#ff285ccc}.attack{right:145px;bottom:35px;width:78px;height:78px;background:#283342e8;font-size:23px}.hint{position:fixed;z-index:12;left:50%;top:18px;transform:translateX(-50%);padding:9px 15px;border-radius:12px;background:#05080de8;border:1px solid #fff2;display:none;font-weight:900}#toast{position:fixed;z-index:50;left:50%;bottom:180px;transform:translateX(-50%);display:none;padding:15px 22px;border-radius:15px;background:#060a10ee;border:1px solid #ffffff20;font-weight:900;box-shadow:0 10px 40px #000}#vignette{position:fixed;inset:0;z-index:8;pointer-events:none;box-shadow:inset 0 0 130px #0008}@media(max-width:650px){.games{grid-template-columns:1fr}.menuBox{padding:24px}.joy{width:135px;height:135px}.jump{width:95px;height:95px}.attack{right:125px;width:70px;height:70px}}</style></head><body><canvas id="game"></canvas><div id="vignette"></div><div id="menu"><div class="menuBox"><h1 class="logo">🦑 SQUID GAME</h1><div class="sub">ULTRA 3D • SURVIVAL ARENA</div><div class="games"><button class="gameBtn" id="sunBtn"><b class="pink">●</b>1, 2, 3 SOLEIL<small>Feu rouge = immobile</small></button><button class="gameBtn" id="glassBtn"><b class="cyan">◇</b>PONT EN VERRE<small>Choisis la bonne vitre</small></button><button class="gameBtn" id="dalgonaBtn"><b class="gold">★</b>DALGONA<small>Découpe la forme</small></button><button class="gameBtn" id="pvpBtn"><b class="violet">⚔</b>PVP ARENA<small>Combats les gardes</small></button></div><div class="help">💻 <b>PC</b> : WASD / flèches • ESPACE = saut<br>📱 <b>Mobile</b> : joystick + SAUT • ⚔️ attaque en PvP</div></div></div><div id="hud"><div class="badge" id="stage">ÉPREUVE</div><div class="badge" id="info">PRÊT</div><div class="badge" id="light">🟢 BOUGE</div></div><button id="back">☰ LOBBY</button><div id="touch"><div class="joy" id="joy"><div class="knob" id="knob"></div></div><button class="action attack" id="attack">⚔️</button><button class="action jump" id="jump">SAUT</button></div><div class="hint" id="hint"></div><div id="toast"></div><script>(function(){'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W=innerWidth,H=innerHeight,DPR=devicePixelRatio||1;function resize(){W=innerWidth;H=innerHeight;DPR=devicePixelRatio||1;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();const $=id=>document.getElementById(id);let mode='',running=false,alive=true,won=false,last=0,keys={},joyX=0,joyY=0,joyDown=false,vy=0,ground=true,phase=0,lightGreen=true,lightTimer=0,shake=0,score=0,enemies=[],panels=[];let player={x:0,y:0,z:18,rot:0};function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',1800)}function P(x,y,z){return{x,y,z}}function proj(p){const cam=14,den=cam-p.z,scale=760/Math.max(4,den);return{x:W/2+p.x*scale,y:H*.56-p.y*scale,scale}}function poly(a,fill,stroke){ctx.beginPath();a.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}}function quad3D(a,b,c,d,fill,stroke){poly([proj(a),proj(b),proj(c),proj(d)],fill,stroke)}function cube(px,py,pz,w,h,d,fill){const a=P(px-w/2,py,pz-d/2),b=P(px+w/2,py,pz-d/2),c=P(px+w/2,py+h,pz-d/2),d1=P(px-w/2,py+h,pz-d/2),e=P(px-w/2,py,pz+d/2),f=P(px+w/2,py,pz+d/2),g=P(px+w/2,py+h,pz+d/2),h1=P(px-w/2,py+h,pz+d/2);quad3D(a,b,c,d1,fill);quad3D(b,f,g,c,fill);quad3D(d1,c,g,h1,fill);quad3D(e,a,d1,h1,fill);quad3D(f,e,h1,g,fill)}function glowCircle(x,y,r,color){ctx.save();ctx.shadowBlur=r*.7;ctx.shadowColor=color;ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.restore()}function person(px,py,pz,color,scale=1,guard=false){const s=scale;cube(px,py,pz,.75*s,1.25*s,.5*s,color);const head=proj(P(px,py+1.82*s,pz)),rr=Math.max(5,16*head.scale/55);ctx.fillStyle=guard?'#191b20':'#e7ad86';ctx.beginPath();ctx.arc(head.x,head.y,rr,0,Math.PI*2);ctx.fill();if(guard){ctx.fillStyle='#111';ctx.fillRect(head.x-rr,head.y-rr*.35,rr*2,rr*.45);ctx.fillStyle='#ff285c';ctx.font=Math.max(9,rr)+'px Arial';ctx.textAlign='center';ctx.fillText('△',head.x,head.y+rr*.1)}else{ctx.fillStyle='#15181e';ctx.fillRect(head.x-rr*.85,head.y-rr*.35,rr*1.7,rr*.45)}}function floor(){quad3D(P(-42,0,-70),P(42,0,-70),P(42,0,35),P(-42,0,35),'#30363e');for(let z=-65;z<30;z+=5)quad3D(P(-42,.01,z),P(42,.01,z),P(42,.01,z+.045),P(-42,.01,z+.045),'#ffffff12');for(let i=-40;i<=40;i+=5)quad3D(P(i,.01,-70),P(i+.04,.01,-70),P(i+.04,.01,35),P(i,.01,35),'#ffffff09')}function arena(){ctx.clearRect(0,0,W,H);const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,mode==='glass'?'#071326':'#090d16');g.addColorStop(.55,mode==='sun'?'#7bb8ce':'#202936');g.addColorStop(1,'#07090d');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);floor();const horizon=H*.56;ctx.fillStyle='#ffffff08';ctx.fillRect(0,horizon,W,2)}function drawSun(){for(let i=0;i<12;i++){const x=-22+i*4;cube(x,0,-8,2.7,.08,1.4,i%2?'#e8eef2':'#bfc9d0')}cube(0,0,-39,38,.5,1,'#ff315f');for(let i=-18;i<=18;i+=6)cube(i,.5,-38.3,2,.5,.5,'#161a20');person(0,0,-43,'#d8dfe5',1.8,true);const p=proj(P(0,4,-43));glowCircle(p.x,p.y,22,'#ff3159');ctx.fillStyle='#ff3159';ctx.font='900 18px Arial';ctx.textAlign='center';ctx.fillText('STOP',p.x,p.y+5)}function drawGlass(){panels.forEach((q,i)=>{const c=q.safe<0?'#ff5b7d':'#51dfff';cube(-2.35,.08,q.z,3.7,.15,3.7,c+'55');cube(2.35,.08,q.z,3.7,.15,3.7,c+'55');cube(-4.25,0,q.z,0.12,2.2,3.7,'#d8e5ed33');cube(4.25,0,q.z,0.12,2.2,3.7,'#d8e5ed33');const l=proj(P(-2.35,.35,q.z));ctx.strokeStyle='#fff8';ctx.strokeRect(l.x-20,l.y-8,40,16)});cube(0,0,-38,12,.35,3,'#54dfff55')}function drawPvp(){for(let i=0;i<enemies.length;i++)person(enemies[i].x,enemies[i].y,enemies[i].z,enemies[i].hit>0?'#fff':'#b91e4b',1,true);for(let r=2;r<18;r+=4){const p=proj(P(0,.02,8));ctx.strokeStyle='#ffffff12';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,r*35,0,Math.PI*2);ctx.stroke()}}function drawPlayer(){if(!running||mode==='dalgona')return;person(player.x,player.y,player.z,'#20d89a',1,false);const p=proj(P(player.x,player.y+.2,player.z));ctx.fillStyle='#0008';ctx.beginPath();ctx.ellipse(p.x,p.y+15,25*p.scale/55,9*p.scale/55,0,0,Math.PI*2);ctx.fill()}function draw(){arena();if(mode==='sun')drawSun();if(mode==='glass')drawGlass();if(mode==='pvp')drawPvp();drawPlayer();if(mode==='sun'){ctx.font='900 25px Arial';ctx.textAlign='center';ctx.fillStyle=lightGreen?'#55ff9b':'#ff416d';ctx.fillText(lightGreen?'🟢 BOUGE':'🔴 STOP',W/2,75)}if(shake>0){ctx.fillStyle='#ff174844';ctx.fillRect(0,0,W,H)}}function start(m){mode=m;running=true;alive=true;won=false;score=0;phase=0;lightTimer=0;lightGreen=true;vy=0;ground=true;shake=0;player={x:0,y:0,z:18,rot:0};panels=[];enemies=[];$('menu').classList.add('hidden');$('hud').style.display='flex';$('back').style.display='block';$('touch').style.display=m==='dalgona'?'none':'block';$('light').style.display=m==='sun'?'block':'none';$('stage').textContent={sun:'🟢 1, 2, 3 SOLEIL',glass:'🌉 PONT EN VERRE',dalgona:'🍪 DALGONA',pvp:'⚔️ PVP ARENA'}[m];$('info').textContent={sun:'Atteins la ligne d’arrivée',glass:'Une vitre sur deux est sûre',dalgona:'Découpe la forme',pvp:'Élimine tous les gardes'}[m];if(m==='glass')for(let i=0;i<12;i++)panels.push({z:12-i*4.5,safe:i%2?-1:1});if(m==='pvp')for(let i=0;i<7;i++)enemies.push({x:(i-3)*3.2,y:0,z:-5-i*3,hp:3,hit:0});if(m==='dalgona')dalgona();toast('🎮 ÉPREUVE LANCÉE');}function lobby(){running=false;$('menu').classList.remove('hidden');$('hud').style.display='none';$('back').style.display='none';$('touch').style.display='none';const d=$('dalgona');if(d)d.remove()}function jump(){if(running&&alive&&ground&&mode!=='dalgona'){vy=9.5;ground=false}}function attack(){if(mode!=='pvp'||!alive)return;let hit=false;enemies.forEach(e=>{if(Math.hypot(e.x-player.x,e.z-player.z)<3.3){e.hp--;e.hit=.18;e.z-=1.2;hit=true}});if(hit)score++;enemies=enemies.filter(e=>e.hp>0);toast(hit?'⚔️ COUP PORTÉ !':'⚔️ DANS LE VIDE');if(!enemies.length){won=true;toast('🏆 ARENA GAGNÉE !');setTimeout(lobby,1500)}}function update(dt){if(!running||!alive)return;const mx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joyX,mz=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+joyY,n=Math.hypot(mx,mz);let ax=mx,az=mz;if(n>1){ax/=n;az/=n}player.x+=ax*7*dt;player.z+=az*7*dt;player.x=Math.max(-8,Math.min(8,player.x));vy-=24*dt;player.y+=vy*dt;if(player.y<=0){player.y=0;vy=0;ground=true}if(mode==='sun'){lightTimer+=dt;if(lightTimer>(lightGreen?2.7:2.1)){lightGreen=!lightGreen;lightTimer=0}$('light').textContent=lightGreen?'🟢 BOUGE':'🔴 STOP';if(!lightGreen&&n>.15){alive=false;shake=1;toast('💀 TU AS BOUGÉ !');setTimeout(lobby,1500)}if(player.z<-37&&!won){won=true;toast('🏆 VICTOIRE !');setTimeout(lobby,1500)}}if(mode==='glass'){for(const q of panels){if(Math.abs(player.z-q.z)<1.8&&Math.abs(player.x)<4){const side=player.x<0?-1:1;if(side!==q.safe){alive=false;shake=1;toast('💥 VITRE CASSÉE !');setTimeout(lobby,1500);break}}}if(player.z<-38&&!won){won=true;toast('🏆 PONT TRAVERSÉ !');setTimeout(lobby,1500)}}if(mode==='pvp'){for(const e of enemies){e.hit=Math.max(0,e.hit-dt);const dx=player.x-e.x,dz=player.z-e.z,d=Math.hypot(dx,dz);if(d<10&&d>.05){e.x+=dx/d*1.8*dt;e.z+=dz/d*1.8*dt}if(d<1.15){alive=false;shake=1;toast('💀 TU AS ÉTÉ ÉLIMINÉ !');setTimeout(lobby,1500)}}}}function dalgona(){const ui=document.createElement('div');ui.id='dalgona';ui.style.cssText='position:fixed;inset:0;z-index:40;background:radial-gradient(circle,#5a2811,#130805);display:flex;align-items:center;justify-content:center';ui.innerHTML='<div id="cookie" style="position:relative;width:min(78vw,440px);height:min(78vw,440px);border-radius:50%;background:radial-gradient(circle,#e8ad55,#b96d27);box-shadow:inset 0 0 0 12px #7d451d,0 25px 80px #000;font-family:Arial"><h2 style="position:absolute;top:-65px;width:100%;text-align:center;font-size:26px">🍪 TRACE SANS SORTIR !</h2><div style="position:absolute;inset:18%;border:7px dashed #593316;border-radius:50%;clip-path:polygon(50% 0,61% 34%,98% 35%,69% 57%,79% 100%,50% 72%,21% 100%,31% 57%,2% 35%,39% 34%);pointer-events:none"></div><div style="position:absolute;left:10%;right:10%;bottom:-55px;height:15px;border-radius:10px;background:#fff2;overflow:hidden"><div id="fill" style="height:100%;width:0;background:#48f19a"></div></div></div>';document.body.appendChild(ui);const cookie=$('cookie'),fill=$('fill');let progress=0,drawing=false;function trace(e){if(!drawing)return;const r=cookie.getBoundingClientRect(),xx=e.clientX-r.left,yy=e.clientY-r.top;if(Math.hypot(xx-r.width/2,yy-r.height/2)<r.width*.44){progress=Math.min(1,progress+.014);fill.style.width=progress*100+'%';if(progress>=1){ui.remove();toast('🏆 DALGONA RÉUSSIE !');setTimeout(lobby,1200)}}}cookie.onpointerdown=e=>{drawing=true;trace(e)};cookie.onpointermove=trace;addEventListener('pointerup',()=>drawing=false,{once:false});setTimeout(()=>{if(ui.isConnected){ui.remove();toast('💀 DALGONA RATÉE !');setTimeout(lobby,1200)}},20000)}$('sunBtn').onclick=()=>start('sun');$('glassBtn').onclick=()=>start('glass');$('dalgonaBtn').onclick=()=>start('dalgona');$('pvpBtn').onclick=()=>start('pvp');$('back').onclick=lobby;$('jump').onclick=jump;$('attack').onclick=attack;addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.code==='Space')jump()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);const joy=$('joy'),knob=$('knob');function joyMove(e){const r=joy.getBoundingClientRect();let xx=e.clientX-r.left-r.width/2,yy=e.clientY-r.top-r.height/2,m=55,d=Math.hypot(xx,yy);if(d>m){xx=xx/d*m;yy=yy/d*m}joyX=xx/m;joyY=yy/m;knob.style.transform=`translate(calc(-50% + ${xx}px),calc(-50% + ${yy}px))`}joy.onpointerdown=e=>{joyDown=true;joy.setPointerCapture(e.pointerId);joyMove(e)};joy.onpointermove=e=>{if(joyDown)joyMove(e)};joy.onpointerup=()=>{joyDown=false;joyX=joyY=0;knob.style.transform='translate(-50%,-50%)'};joy.onpointercancel=joy.onpointerup;function loop(t){const dt=Math.min(.04,(t-last||0)/1000);last=t;update(dt);draw();shake=Math.max(0,shake-dt*4);requestAnimationFrame(loop)}requestAnimationFrame(loop)})();</script></body></html>

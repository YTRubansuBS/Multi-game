<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Squid Game 3D • Multi-game</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#05070b;color:#fff;font-family:Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}#app{position:fixed;inset:0}#game{position:absolute;inset:0;width:100%;height:100%;display:block}#ui{position:absolute;inset:0;pointer-events:none}.panel{pointer-events:auto;background:#090d16ed;border:1px solid #ffffff1f;border-radius:22px;box-shadow:0 20px 80px #0009;backdrop-filter:blur(12px)}#login{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;background:radial-gradient(circle at 50% 20%,#53152d,#07090f 55%,#020306)}#login .panel{width:min(440px,94vw);padding:28px;text-align:center}.logo{font-size:clamp(35px,8vw,64px);margin:0 0 6px;color:#ff3f6d;text-shadow:0 0 30px #ff285c88}.muted{color:#aeb7c5}.field{width:100%;padding:13px 15px;margin:7px 0;border-radius:12px;border:1px solid #ffffff18;background:#ffffff08;color:white;outline:none}.primary,.secondary,.danger{border:0;border-radius:12px;padding:13px 16px;font-weight:900;color:#fff;margin-top:8px}.primary{background:#e62e5d}.secondary{background:#263143}.danger{background:#7c1833}.row{display:flex;gap:8px}.row>*{flex:1}#top{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;align-items:center;pointer-events:none}.pill{padding:9px 12px;border-radius:12px;background:#080c14dd;border:1px solid #ffffff18;font-weight:900}.topRight{margin-left:auto;display:flex;gap:7px;pointer-events:auto}.smallBtn{padding:9px 12px;border:1px solid #ffffff18;border-radius:12px;background:#0a0f18ee;color:#fff;font-weight:900}.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;pointer-events:none}.box{width:min(900px,95vw);max-height:88vh;overflow:auto;padding:25px;pointer-events:auto}.menuGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.game{min-height:115px;border:1px solid #ffffff14;border-radius:18px;background:linear-gradient(145deg,#17202d,#090d14);color:white;text-align:left;padding:17px}.game b{display:block;font-size:30px}.pink{color:#ff416d}.cyan{color:#54dfff}.gold{color:#ffd45a}.violet{color:#b68cff}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.tab{padding:10px 13px;border:1px solid #ffffff18;border-radius:11px;background:#111722;color:white}.list{display:grid;gap:8px}.item{padding:12px;border-radius:13px;background:#ffffff08;border:1px solid #ffffff10;display:flex;align-items:center;gap:8px}.item span:first-child{flex:1}.callBtn{padding:9px 11px;border:0;border-radius:10px;background:#1fbc79;color:#fff;font-weight:900}.callBtn.video{background:#e83f70}.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#e52e62,#5532b9);font-weight:900}.form{display:grid;grid-template-columns:1fr 1fr;gap:8px}.form input{margin:0}.wide{grid-column:1/-1}#touch{position:absolute;inset:0;pointer-events:none;display:none}.joy{position:absolute;left:22px;bottom:22px;width:145px;height:145px;border:2px solid #fff3;border-radius:50%;background:#ffffff0b;pointer-events:auto}.knob{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px;border-radius:50%;background:#ffffff24;border:2px solid #fff6}.jump{position:absolute;right:24px;bottom:25px;width:105px;height:105px;border:0;border-radius:50%;background:#ff285dcc;color:#fff;font-weight:900;pointer-events:auto}.attack{position:absolute;right:140px;bottom:34px;width:76px;height:76px;border:0;border-radius:50%;background:#303b4d;color:#fff;font-size:22px;pointer-events:auto}.hud{position:absolute;left:14px;top:70px;display:flex;gap:7px;flex-wrap:wrap}.badge{padding:9px 12px;border-radius:11px;background:#080c14dd;border:1px solid #ffffff18;font-weight:900}.call{position:absolute;right:14px;bottom:14px;width:min(430px,92vw);padding:12px;display:none}.videos{display:grid;grid-template-columns:1fr 1fr;gap:7px}.videos video{width:100%;aspect-ratio:16/10;background:#000;border-radius:12px;object-fit:cover}.callControls{display:flex;gap:7px;margin-top:8px}.callControls button{flex:1}.status{font-size:13px;color:#aeb7c5;margin:6px 0}.danger2{background:#d6284f!important}.green{color:#55f2a2}.toast{position:absolute;left:50%;bottom:175px;transform:translateX(-50%);padding:13px 18px;background:#05080eee;border:1px solid #fff2;border-radius:13px;display:none;pointer-events:none;font-weight:900;z-index:30}@media(max-width:650px){.menuGrid{grid-template-columns:1fr}.form{grid-template-columns:1fr}.box{padding:18px}.joy{width:130px;height:130px}.jump{width:92px;height:92px}.attack{right:120px;width:68px;height:68px}.call{bottom:10px;right:8px}.videos{grid-template-columns:1fr 1fr}}</style></head><body><div id="app"><canvas id="game"></canvas><div id="ui"><div id="login"><div class="panel"><h1 class="logo">🦑 MULTI-GAME</h1><p class="muted">Vrai monde 3D • comptes • groupes • appels</p><input id="user" class="field" placeholder="Nom d'utilisateur"><input id="pass" class="field" type="password" placeholder="Mot de passe"><div class="row"><button id="loginBtn" class="primary">Connexion</button><button id="registerBtn" class="secondary">Créer un compte</button></div><button id="guestBtn" class="secondary" style="width:100%">Continuer en invité</button><p id="loginMsg" class="muted"></p></div></div><div id="top" class="hidden"><div class="pill">👤 <span id="me"></span></div><div class="topRight"><button class="smallBtn" id="socialBtn">👥 Social</button><button class="smallBtn" id="logoutBtn">Déconnexion</button></div></div><div id="lobby" class="screen hidden"><div class="panel box"><h1>🦑 SQUID GAME <span class="pink">3D</span></h1><p class="muted">Vrai moteur 3D WebGL, caméra troisième personne.</p><div class="menuGrid"><button class="game" id="sun"><b class="pink">●</b>1, 2, 3 SOLEIL<small>La poupée se retourne. 1 seconde pour s'arrêter.</small></button><button class="game" id="glass"><b class="cyan">◇</b>PONT EN VERRE<small>Traverse sans casser la mauvaise vitre.</small></button><button class="game" id="dalgona"><b class="gold">★</b>DALGONA<small>Découpe la forme.</small></button><button class="game" id="pvp"><b class="violet">⚔</b>PVP ARENA<small>Combat les gardes.</small></button></div><p class="muted">PC : WASD / flèches • Espace : saut • Mobile : joystick + boutons</p></div></div><div id="social" class="screen hidden"><div class="panel box"><div class="tabs"><button class="tab" id="friendsTab">👥 Amis</button><button class="tab" id="groupsTab">👨‍👩‍👧 Groupe</button><button class="tab" id="backLobby">🎮 Jeux</button></div><div id="socialContent"></div></div></div><div id="hud" class="hud hidden"><div class="badge" id="stage">ÉPREUVE</div><div class="badge" id="state">PRÊT</div></div><div id="touch"><div class="joy" id="joy"><div class="knob" id="knob"></div></div><button id="attack" class="attack">⚔️</button><button id="jump" class="jump">SAUT</button></div><div id="toast" class="toast"></div><div id="call" class="panel call"><b>📞 Appel avec <span id="callName">...</span></b><div id="callStatus" class="status">Connexion…</div><div class="videos"><video id="remote" autoplay playsinline></video><video id="local" autoplay playsinline muted></video></div><div class="callControls"><button id="mute" class="secondary">🎙️ Micro</button><button id="cam" class="secondary">📷 Caméra</button><button id="hang" class="danger2 danger">☎️ Raccrocher</button></div></div></div></div><script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script><script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script><script>(function(){'use strict';const $=id=>document.getElementById(id);let scene,camera,renderer,clock,player,world=[],keys={},joyX=0,joyY=0,vy=0,onGround=true,gameMode='',running=false,turn=false,turnTimer=0,lastMove=false,enemies=[],glass=[],peer=null,localStream=null,currentCall=null,remoteStream=null,profile=null;const users=JSON.parse(localStorage.getItem('mg_users')||'{}');function saveUsers(){localStorage.setItem('mg_users',JSON.stringify(users))}function toast(t){let e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(e.t);e.timer=setTimeout(()=>e.style.display='none',1800)}function login(name){profile={name};$('me').textContent=name;$('login').classList.add('hidden');$('top').classList.remove('hidden');$('lobby').classList.remove('hidden');init3D();initPeer()}function init3D(){if(scene)return;scene=new THREE.Scene();scene.background=new THREE.Color(0x9bc6d6);scene.fog=new THREE.Fog(0x9bc6d6,30,130);camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,300);renderer=new THREE.WebGLRenderer({canvas:$('game'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;clock=new THREE.Clock();let hemi=new THREE.HemisphereLight(0xffffff,0x334455,2.2);scene.add(hemi);let sunLight=new THREE.DirectionalLight(0xffffff,3.2);sunLight.position.set(20,35,15);sunLight.castShadow=true;sunLight.shadow.mapSize.set(2048,2048);scene.add(sunLight);makePlayer();window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});animate()}function mat(c,rough=.75){return new THREE.MeshStandardMaterial({color:c,roughness:rough,metalness:.05})}function box(w,h,d,c){let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.castShadow=m.receiveShadow=true;return m}function cyl(r,h,c){let m=new THREE.Mesh(new THREE.CylinderGeometry(r,r*.96,h,20),mat(c));m.castShadow=m.receiveShadow=true;return m}function makeCharacter(color=0x16856a,mask=false){let g=new THREE.Group(),body=box(.9,1.15,.55,color);body.position.y=1.35;g.add(body);let head=new THREE.Mesh(new THREE.SphereGeometry(.39,24,18),mat(mask?0x111318:0xd99570));head.position.y=2.18;head.castShadow=true;g.add(head);let leg1=box(.25,.8,.32,color),leg2=box(.25,.8,.32,color);leg1.position.set(-.22,.45,0);leg2.position.set(.22,.45,0);g.add(leg1,leg2);let arm1=box(.22,.82,.25,color),arm2=box(.22,.82,.25,color);arm1.position.set(-.62,1.35,0);arm2.position.set(.62,1.35,0);arm1.rotation.z=-.12;arm2.rotation.z=.12;g.add(arm1,arm2);if(mask){let visor=box(.58,.42,.06,0x090b10);visor.position.set(0,2.17,-.36);g.add(visor)}else{let hair= new THREE.Mesh(new THREE.SphereGeometry(.4,20,10,0,Math.PI*2,0,Math.PI*.42),mat(0x15171c));hair.position.set(0,2.28,-.02);g.add(hair)}return g}function makePlayer(){player=makeCharacter();player.position.set(0,0,18);scene.add(player)}function clearWorld(){world.forEach(o=>scene.remove(o));world=[];enemies.forEach(o=>scene.remove(o));enemies=[];glass=[]}function floor(){let f=box(70,.3,150,0x34383d);f.position.set(0,-.2,-30);scene.add(f);world.push(f);for(let z=-90;z<35;z+=10){let l=box(70,.02,.05,0xffffff);l.material.transparent=true;l.material.opacity=.08;l.position.set(0,.01,z);scene.add(l);world.push(l)}}function doll(){let d=makeCharacter(0xd91e52,true);d.scale.set(2.6,2.6,2.6);d.position.set(0,0,-48);d.rotation.y=Math.PI;scene.add(d);world.push(d);let hair=new THREE.Mesh(new THREE.SphereGeometry(1.05,24,12),mat(0x5a301e));hair.scale.set(1.05,.55,.9);hair.position.set(0,5.35,-48);scene.add(hair);world.push(hair)}function startGame(m){gameMode=m;running=true;turn=false;turnTimer=0;vy=0;onGround=true;player.position.set(0,0,18);clearWorld();floor();$('lobby').classList.add('hidden');$('social').classList.add('hidden');$('hud').classList.remove('hidden');$('touch').style.display='block';$('attack').style.display=m==='pvp'?'block':'none';$('stage').textContent={sun:'🟢 1,2,3 SOLEIL',glass:'🌉 PONT EN VERRE',dalgona:'🍪 DALGONA',pvp:'⚔️ PVP'}[m];$('state').textContent='PRÊT';if(m==='sun')doll();if(m==='glass'){for(let i=0;i<14;i++){let safe=i%2===0,z=8-i*5;let a=box(3.6,.16,3.7,safe?0x4fd9ff:0x68a7b8);let b=box(3.6,.16,3.7,safe?0x68a7b8:0x4fd9ff);a.position.set(-2.2,.08,z);b.position.set(2.2,.08,z);scene.add(a,b);world.push(a,b);glass.push({z,safe,a,b})}}if(m==='pvp'){for(let i=0;i<7;i++){let e=makeCharacter(0xd91e52,true);e.position.set((i-3)*3.2,0,-6-i*4);scene.add(e);enemies.push(e)}}toast('🎮 Épreuve lancée')}function animate(){requestAnimationFrame(animate);let dt=Math.min(clock?.getDelta()||.016,.05);if(running)update(dt);if(renderer&&scene&&camera){let target=player.position.clone();target.y+=1.25;let desired=player.position.clone();desired.y+=4.2;desired.z+=7.5;camera.position.lerp(desired,1-Math.pow(.001,dt));camera.lookAt(target);renderer.render(scene,camera)}}function update(dt){let mx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joyX,mz=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);let n=Math.hypot(mx,mz);if(n>1){mx/=n;mz/=n}let moving=n>.08;if(moving){player.rotation.y=Math.atan2(mx,-mz);player.translateZ(moving? -6*dt:0)}if(gameMode==='sun'){if(turn){if(moving&&!lastMove){turnTimer+=dt}if(moving)turnTimer+=dt;if(!moving)turnTimer=0;if(turnTimer>=1){die('💀 La poupée t’a vu !')}}}player.position.x=Math.max(-8,Math.min(8,player.position.x));vy-=22*dt;player.position.y+=vy*dt;if(player.position.y<=0){player.position.y=0;vy=0;onGround=true}if(gameMode==='sun'){if(player.position.z<-38){running=false;toast('🏆 VICTOIRE !');setTimeout(()=>lobby(),1200)}turnTimer+=0;if(Math.random()<dt*.32){turn=!turn;turnTimer=0;lastMove=false;$('state').textContent=turn?'🔴 ARRÊTE-TOI !':'🟢 BOUGE !';if(!turn)turnTimer=0}}if(gameMode==='glass'){for(const v of glass){if(Math.abs(player.position.z-v.z)<1.7){let left=player.position.x<0;if(left!==v.safe){die('💥 Mauvaise vitre !');break}}}if(player.position.z<-63){running=false;toast('🏆 PONT TRAVERSÉ !');setTimeout(lobby,1200)}}if(gameMode==='pvp'){enemies.forEach(e=>{let dx=player.position.x-e.position.x,dz=player.position.z-e.position.z,d=Math.hypot(dx,dz);if(d<12&&d>.5){e.position.x+=dx/d*1.5*dt;e.position.z+=dz/d*1.5*dt}if(d<1.25)die('💀 Éliminé !')});if(!enemies.length){running=false;toast('🏆 ARENA GAGNÉE !');setTimeout(lobby,1200)}}lastMove=moving}function die(t){if(!running)return;running=false;toast(t);setTimeout(lobby,1400)}function lobby(){$('lobby').classList.remove('hidden');$('hud').classList.add('hidden');$('touch').style.display='none';gameMode=''}function jump(){if(running&&onGround){vy=9;onGround=false}}function hit(){if(gameMode!=='pvp')return;let hit=false;enemies=enemies.filter(e=>{if(player.position.distanceTo(e.position)<3){scene.remove(e);hit=true;return false}return true});toast(hit?'⚔️ COUP !':'⚔️ RATE !')}function social(type='friends'){$('lobby').classList.add('hidden');$('social').classList.remove('hidden');renderSocial(type)}function renderSocial(type){let c=$('socialContent');if(type==='friends'){c.innerHTML='<h2>👥 Mes amis</h2><div class="form"><input id="addFriend" class="field" placeholder="Nom d’utilisateur"><button class="primary" id="addFriendBtn">Ajouter</button></div><div class="list" id="friendList"></div>';let names=JSON.parse(localStorage.getItem('mg_friends_'+profile.name)||'[]');let list=$('friendList');list.innerHTML=names.length?names.map(n=>'<div class="item"><div class="avatar">'+n[0].toUpperCase()+'</div><span>'+n+'</span><button class="callBtn" data-call="'+n+'">🎙️</button><button class="callBtn video" data-video="'+n+'">📹</button></div>').join(''):'<p class="muted">Aucun ami pour le moment.</p>';$('addFriendBtn').onclick=()=>{let n=$('addFriend').value.trim();if(!n)return;if(!users[n]){toast('Utilisateur introuvable');return}if(!names.includes(n))names.push(n);localStorage.setItem('mg_friends_'+profile.name,JSON.stringify(names));renderSocial('friends')};document.querySelectorAll('[data-call]').forEach(b=>b.onclick=()=>callUser(b.dataset.call,false));document.querySelectorAll('[data-video]').forEach(b=>b.onclick=()=>callUser(b.dataset.video,true))}else{c.innerHTML='<h2>👨‍👩‍👧 Groupe</h2><p class="muted">Crée un groupe ou rejoins avec un code. Le code peut être partagé à tes amis.</p><div class="form"><input id="groupName" class="field" placeholder="Nom du groupe"><button class="primary" id="createGroup">Créer</button><input id="groupCode" class="field wide" placeholder="Code du groupe"><button class="secondary wide" id="joinGroup">Rejoindre</button></div><div id="groupInfo"></div>';$('createGroup').onclick=()=>{let code=Math.random().toString(36).slice(2,8).toUpperCase();localStorage.setItem('mg_group_'+code,JSON.stringify({name:$('groupName').value||'Mon groupe',owner:profile.name,members:[profile.name]}));$('groupInfo').innerHTML='<p>Groupe créé : <b>'+code+'</b></p>';toast('👥 Code copié : '+code);navigator.clipboard?.writeText(code)};$('joinGroup').onclick=()=>{let code=$('groupCode').value.trim().toUpperCase(),g=JSON.parse(localStorage.getItem('mg_group_'+code)||'null');if(!g)return toast('Groupe introuvable');if(!g.members.includes(profile.name))g.members.push(profile.name);localStorage.setItem('mg_group_'+code,JSON.stringify(g));$('groupInfo').innerHTML='<p>👥 '+g.name+' — '+g.members.length+' membre(s)</p><p class="muted">'+g.members.join(', ')+'</p>'}}}function initPeer(){if(!window.Peer)return;peer=new Peer(undefined,{debug:0});peer.on('open',id=>{profile.peer=id;users[profile.name]={...users[profile.name],peer:id};saveUsers()});peer.on('call',async call=>{let ok=confirm('📞 '+(call.metadata?.from||'Un utilisateur')+' t’appelle. Accepter ?');if(!ok){call.close();return}try{localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:call.metadata?.video!==false});$('local').srcObject=localStream;showCall(call.metadata?.from||'Appel');call.answer(localStream);wireCall(call)}catch(e){toast('Autorise le micro/caméra pour répondre');call.close()}});peer.on('error',e=>toast('Appel : '+e.type))}async function callUser(name,video){if(!peer||!users[name]?.peer){toast('Cet utilisateur n’est pas connecté');return}try{localStream=await navigator.mediaDevices.getUserMedia({audio:true,video});$('local').srcObject=localStream;showCall(name);let call=peer.call(users[name].peer,localStream,{metadata:{from:profile.name,video}});wireCall(call)}catch(e){toast('Micro/caméra refusé ou indisponible')}}function showCall(name){$('call').style.display='block';$('callName').textContent=name;$('callStatus').textContent='Connexion…'}function wireCall(call){currentCall=call;call.on('stream',s=>{$('remote').srcObject=s;remoteStream=s;$('callStatus').textContent='🟢 Appel en cours — il reste actif jusqu’à raccrochage'});call.on('close',()=>endCall(false));call.on('error',()=>{$('callStatus').textContent='Connexion interrompue — tentative de reprise…';setTimeout(()=>{if(currentCall===call)call.reconnect?.()},1500)});$('callStatus').textContent='🔄 Connexion…'}function endCall(send=true){if(currentCall){try{currentCall.close()}catch(e){}currentCall=null}if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null}$('remote').srcObject=null;$('local').srcObject=null;$('call').style.display='none';if(send)toast('☎️ Appel terminé')}$('hang').onclick=()=>endCall(true);$('mute').onclick=()=>{if(localStream)localStream.getAudioTracks().forEach(t=>t.enabled=!t.enabled);$('mute').textContent=localStream?.getAudioTracks()[0]?.enabled?'🎙️ Micro':'🔇 Micro'};$('cam').onclick=()=>{if(localStream)localStream.getVideoTracks().forEach(t=>t.enabled=!t.enabled);$('cam').textContent=localStream?.getVideoTracks()[0]?.enabled?'📷 Caméra':'🚫 Caméra'};$('loginBtn').onclick=()=>{let n=$('user').value.trim(),p=$('pass').value;if(!n||!p)return $('loginMsg').textContent='Remplis les deux champs.';if(!users[n]||users[n].pass!==p)return $('loginMsg').textContent='Identifiant ou mot de passe incorrect.';login(n)};$('registerBtn').onclick=()=>{let n=$('user').value.trim(),p=$('pass').value;if(!n||!p)return $('loginMsg').textContent='Choisis un identifiant et un mot de passe.';if(users[n])return $('loginMsg').textContent='Ce compte existe déjà.';users[n]={pass:p,peer:null};saveUsers();login(n)};$('guestBtn').onclick=()=>login('Invité_'+Math.floor(Math.random()*9999));$('socialBtn').onclick=()=>social('friends');$('friendsTab').onclick=()=>renderSocial('friends');$('groupsTab').onclick=()=>renderSocial('groups');$('backLobby').onclick=()=>{$('social').classList.add('hidden');$('lobby').classList.remove('hidden')};$('sun').onclick=()=>startGame('sun');$('glass').onclick=()=>startGame('glass');$('pvp').onclick=()=>startGame('pvp');$('dalgona').onclick=()=>toast('🍪 Dalgona : mini-jeu à ajouter dans la prochaine étape');$('jump').onclick=jump;$('attack').onclick=hit;addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space')jump()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);let joy=$('joy'),knob=$('knob'),drag=false;function jm(e){let r=joy.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,m=52,d=Math.hypot(x,y);if(d>m){x=x/d*m;y=y/d*m}joyX=x/m;joyY=y/m;knob.style.transform='translate(calc(-50% + '+x+'px),calc(-50% + '+y+'px))'}joy.onpointerdown=e=>{drag=true;joy.setPointerCapture(e.pointerId);jm(e)};joy.onpointermove=e=>drag&&jm(e);joy.onpointerup=joy.onpointercancel=()=>{drag=false;joyX=joyY=0;knob.style.transform='translate(-50%,-50%)'};$('logoutBtn').onclick=()=>{endCall(false);location.reload()};})();</script></body></html>

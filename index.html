<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Squid Game 3D</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b;color:#fff;font-family:Arial,sans-serif;touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}.hidden{display:none!important}#menu{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#57182c,#100a11 48%,#020306);padding:16px}.menuBox{width:min(94vw,760px);padding:34px;border:1px solid #ff416d66;border-radius:28px;background:#080b12ee;box-shadow:0 0 100px #ff174855,0 25px 80px #000;text-align:center}.logo{font-size:clamp(38px,7vw,72px);letter-spacing:5px;margin:0;text-shadow:0 0 25px #ff285c}.sub{color:#aeb8c7;margin:8px 0 25px}.games{display:grid;grid-template-columns:1fr 1fr;gap:16px}.gameBtn{min-height:105px;border:1px solid #ffffff18;border-radius:20px;background:linear-gradient(145deg,#171d27,#0c1018);color:#fff;font-size:17px;font-weight:900;cursor:pointer}.gameBtn b{display:block;font-size:34px}.gameBtn small{display:block;color:#9da8b8;margin-top:6px}.pink{color:#ff416d}.cyan{color:#54dfff}.gold{color:#ffd45a}.violet{color:#b68cff}.help{margin-top:18px;padding:14px;border-radius:15px;background:#ffffff08;color:#9da8b8;line-height:1.6}#hud{position:fixed;z-index:15;left:14px;top:14px;display:none;gap:8px;flex-wrap:wrap}.badge{padding:10px 14px;border:1px solid #fff2;border-radius:13px;background:#060a11dd;font-weight:900}#back{position:fixed;z-index:16;right:14px;top:14px;display:none;padding:12px 17px;border:1px solid #fff2;border-radius:13px;background:#090d14e8;color:#fff;font-weight:900}#touch{position:fixed;inset:0;z-index:14;display:none;pointer-events:none}.joy{position:absolute;left:22px;bottom:24px;width:155px;height:155px;border-radius:50%;background:#ffffff0c;border:2px solid #ffffff2b;pointer-events:auto}.knob{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px;border-radius:50%;background:#ffffff22;border:2px solid #fff7}.action{position:absolute;border:1px solid #fff5;border-radius:50%;color:#fff;font-weight:900;pointer-events:auto}.jump{right:24px;bottom:28px;width:108px;height:108px;background:#ff285ccc}.attack{right:145px;bottom:35px;width:78px;height:78px;background:#283342e8;font-size:23px}#toast{position:fixed;z-index:50;left:50%;bottom:180px;transform:translateX(-50%);display:none;padding:15px 22px;border-radius:15px;background:#060a10ee;border:1px solid #ffffff20;font-weight:900}@media(max-width:650px){.games{grid-template-columns:1fr}.menuBox{padding:24px}.joy{width:135px;height:135px}.jump{width:95px;height:95px}.attack{right:125px;width:70px;height:70px}}</style></head><body><canvas id="game"></canvas><div id="menu"><div class="menuBox"><h1 class="logo">🦑 SQUID GAME</h1><div class="sub">ULTRA 3D • TROISIÈME PERSONNE</div><div class="games"><button class="gameBtn" id="sunBtn"><b class="pink">●</b>1, 2, 3 SOLEIL<small>La poupée se retourne • 1 seconde pour s'arrêter</small></button><button class="gameBtn" id="glassBtn"><b class="cyan">◇</b>PONT EN VERRE<small>Choisis la bonne vitre</small></button><button class="gameBtn" id="dalgonaBtn"><b class="gold">★</b>DALGONA<small>Découpe la forme</small></button><button class="gameBtn" id="pvpBtn"><b class="violet">⚔</b>PVP ARENA<small>Combats les gardes</small></button></div><div class="help">💻 <b>PC</b> : WASD / flèches • ESPACE = saut<br>📱 <b>Mobile</b> : joystick + SAUT • ⚔️ attaque en PvP</div></div></div><div id="hud"><div class="badge" id="stage">ÉPREUVE</div><div class="badge" id="info">PRÊT</div><div class="badge" id="light">🟢 BOUGE</div></div><button id="back">☰ LOBBY</button><div id="touch"><div class="joy" id="joy"><div class="knob" id="knob"></div></div><button class="action attack" id="attack">⚔️</button><button class="action jump" id="jump">SAUT</button></div><div id="toast"></div><script>(function(){'use strict';const C=document.getElementById('game'),X=C.getContext('2d'),$=id=>document.getElementById(id);let W=innerWidth,H=innerHeight,D=devicePixelRatio||1;function resize(){W=innerWidth;H=innerHeight;D=devicePixelRatio||1;C.width=W*D;C.height=H*D;X.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();let mode='',running=false,alive=true,won=false,last=0,keys={},joyX=0,joyY=0,vy=0,ground=true,light=true,lt=0,shake=0,enemies=[],panels=[],camX=0,camZ=25,walk=0,turnDelay=0;let player={x:0,y:0,z:18,rot:0};function toast(t){let e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(e.t);e.t=setTimeout(()=>e.style.display='none',1700)}function P(x,y,z){return{x,y,z}}function proj(p){let den=camZ-p.z,scale=850/Math.max(5,den);return{x:W/2+(p.x-camX)*scale,y:H*.58-p.y*scale,scale}}function poly(a,f){X.beginPath();a.forEach((p,i)=>i?X.lineTo(p.x,p.y):X.moveTo(p.x,p.y));X.closePath();X.fillStyle=f;X.fill()}function q(a,b,c,d,f){poly([proj(a),proj(b),proj(c),proj(d)],f)}function cube(x,y,z,w,h,d,f){let a=P(x-w/2,y,z-d/2),b=P(x+w/2,y,z-d/2),c=P(x+w/2,y+h,z-d/2),d1=P(x-w/2,y+h,z-d/2),e=P(x-w/2,y,z+d/2),g=P(x+w/2,y,z+d/2),h1=P(x+w/2,y+h,z+d/2);q(a,b,c,d1,f);q(b,g,h1,c,f);q(d1,c,h1,P(x-w/2,y+h,z+d/2),f);q(e,a,d1,P(x-w/2,y+h,z+d/2),f);q(g,e,h1,P(x+w/2,y+h,z+d/2),f)}function limb(x,y,z,w,h,f,a=0){let p=proj(P(x,y,z)),s=p.scale;X.save();X.translate(p.x,p.y);X.rotate(a);X.fillStyle=f;X.fillRect(-w*s/2,-h*s,w*s,h*s);X.fillStyle='#fff2';X.fillRect(-w*s*.35,-h*s,w*s*.15,h*s);X.restore()}function ball(x,y,z,r,f){let p=proj(P(x,y,z));X.fillStyle=f;X.beginPath();X.arc(p.x,p.y,Math.max(3,r*p.scale),0,Math.PI*2);X.fill()}function character(px,py,pz,kind='player',s=1){let mv=Math.sin(walk*10+pz)*.18,guard=kind==='guard',skin='#d99570',suit=guard?'#d91e52':'#16856a',dark='#111318',shoe='#080a0d';let sp=proj(P(px,py+.02,pz));X.fillStyle='#0009';X.beginPath();X.ellipse(sp.x,sp.y+8,28*s*sp.scale/55,9*s*sp.scale/55,0,0,Math.PI*2);X.fill();limb(px-.22*s,py,pz,.25*s,.72*s,suit,mv);limb(px+.22*s,py,pz,.25*s,.72*s,suit,-mv);cube(px-.22*s,py-.04,pz,.34*s,.16*s,.5*s,shoe);cube(px+.22*s,py-.04,pz,.34*s,.16*s,.5*s,shoe);cube(px,py+.62*s,pz,.9*s,.3*s,.55*s,suit);cube(px,py+.88*s,pz,.98*s,.9*s,.58*s,suit);cube(px,py+.9*s,pz-.3*s,.045*s,.72*s,.02*s,dark);limb(px-.62*s,py+.9*s,pz,.23*s,.82*s,suit,-.08+mv);limb(px+.62*s,py+.9*s,pz,.23*s,.82*s,suit,.08-mv);ball(px-.63*s,py+.03*s,pz,.13*s,skin);ball(px+.63*s,py+.03*s,pz,.13*s,skin);cube(px,py+1.72*s,pz,.26*s,.2*s,.26*s,skin);if(guard){ball(px,py+2.03*s,pz,.41*s,dark);cube(px,py+2.04*s,pz-.37*s,.62*s,.46*s,.07*s,dark);let p=proj(P(px,py+2.08*s,pz-.42*s));X.fillStyle='#ff416d';X.font=Math.max(12,14*s*p.scale/55)+'px Arial';X.textAlign='center';X.fillText('△',p.x,p.y+5)}else{ball(px,py+2.03*s,pz,.41*s,skin);ball(px,py+2.13*s,pz-.22*s,.25*s,'#15171c');cube(px,py+2.04*s,pz-.34*s,.5*s,.12*s,.04*s,'#111318')}}function doll(){let x=0,z=-46,s=2.1;character(x,0,z,'guard',s);let p=proj(P(x,4.4,z));X.fillStyle='#f2d2b9';X.beginPath();X.arc(p.x,p.y,18*p.scale/55,0,Math.PI*2);X.fill();X.fillStyle='#5a301e';X.beginPath();X.arc(p.x,p.y-8*p.scale/55,22*p.scale/55,Math.PI,Math.PI*2);X.fill();X.fillStyle='#111';X.beginPath();X.arc(p.x-7*p.scale/55,p.y,3,0,Math.PI*2);X.arc(p.x+7*p.scale/55,p.y,3,0,Math.PI*2);X.fill();X.fillStyle='#ff315e';X.font='900 18px Arial';X.textAlign='center';X.fillText(light?'🟢':'🔴',p.x,p.y-35);X.fillText(light?'BOUGE':'NE BOUGEZ PLUS',p.x,p.y+45)}function floor(){q(P(-45,0,-90),P(45,0,-90),P(45,0,35),P(-45,0,35),'#30343a');for(let z=-85;z<32;z+=5)q(P(-45,.01,z),P(45,.01,z),P(45,.01,z+.045),P(-45,.01,z+.045),'#ffffff12');for(let i=-40;i<=40;i+=5)q(P(i,.01,-90),P(i+.04,.01,-90),P(i+.04,.01,35),P(i,.01,35),'#ffffff09')}function arena(){X.clearRect(0,0,W,H);let g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,mode==='sun'?'#83c4d8':'#061327');g.addColorStop(.48,'#25303a');g.addColorStop(1,'#05070b');X.fillStyle=g;X.fillRect(0,0,W,H);floor()}function sun(){for(let i=0;i<12;i++)cube(-22+i*4,0,-8,2.7,.08,1.4,i%2?'#eef3f5':'#b8c2c8');cube(0,0,-39,38,.5,1,'#f12d56');for(let i=-18;i<=18;i+=6)cube(i,.5,-38.3,2,.5,.5,'#15191f');doll()}function glass(){panels.forEach(v=>{let c=v.safe<0?'#ff5275':'#55ddff';cube(-2.35,.08,v.z,3.7,.15,3.7,c+'55');cube(2.35,.08,v.z,3.7,.15,3.7,c+'55');cube(-4.25,0,v.z,.12,2.2,3.7,'#d8e5ed33');cube(4.25,0,v.z,.12,2.2,3.7,'#d8e5ed33')});cube(0,0,-40,12,.35,3,'#54dfff55')}function pvp(){enemies.forEach(e=>character(e.x,e.y,e.z,'guard',1));for(let r=2;r<18;r+=4){let p=proj(P(0,.02,8));X.strokeStyle='#ffffff12';X.beginPath();X.arc(p.x,p.y,r*35,0,Math.PI*2);X.stroke()}}function draw(){arena();if(mode==='sun')sun();if(mode==='glass')glass();if(mode==='pvp')pvp();if(mode!=='dalgona')character(player.x,player.y,player.z,'player',1);if(mode==='sun'){X.font='900 25px Arial';X.textAlign='center';X.fillStyle=light?'#55ff9b':'#ff416d';X.fillText(light?'🟢 BOUGE':'🔴 NE BOUGE PLUS',W/2,75)}if(shake>0){X.fillStyle='#ff174844';X.fillRect(0,0,W,H)}}function start(m){mode=m;running=true;alive=true;won=false;light=true;lt=0;turnDelay=0;vy=0;ground=true;shake=0;walk=0;player={x:0,y:0,z:18,rot:0};panels=[];enemies=[];camX=0;camZ=25;$('menu').classList.add('hidden');$('hud').style.display='flex';$('back').style.display='block';$('touch').style.display=m==='dalgona'?'none':'block';$('attack').style.display=m==='pvp'?'block':'none';$('light').style.display=m==='sun'?'block':'none';$('stage').textContent={sun:'🟢 1, 2, 3 SOLEIL',glass:'🌉 PONT EN VERRE',dalgona:'🍪 DALGONA',pvp:'⚔️ PVP ARENA'}[m];$('info').textContent={sun:'Avance puis arrête-toi pendant 1 seconde',glass:'Une vitre sur deux est sûre',dalgona:'Découpe la forme',pvp:'Élimine tous les gardes'}[m];if(m==='glass')for(let i=0;i<14;i++)panels.push({z:10-i*4.5,safe:i%2?-1:1});if(m==='pvp')for(let i=0;i<7;i++)enemies.push({x:(i-3)*3.2,y:0,z:-5-i*3,hp:3,hit:0});if(m==='dalgona')dalgona();toast('🎮 ÉPREUVE LANCÉE')}function lobby(){running=false;$('menu').classList.remove('hidden');$('hud').style.display='none';$('back').style.display='none';$('touch').style.display='none';let d=$('dalgona');if(d)d.remove()}function jump(){if(running&&alive&&ground&&mode!=='dalgona'){vy=9.5;ground=false}}function attack(){if(mode!=='pvp'||!alive)return;let hit=false;enemies.forEach(e=>{if(Math.hypot(e.x-player.x,e.z-player.z)<3.2){e.hp--;e.hit=.2;e.z-=1.2;hit=true}});toast(hit?'⚔️ COUP PORTÉ !':'⚔️ DANS LE VIDE');enemies=enemies.filter(e=>e.hp>0);if(!enemies.length){won=true;toast('🏆 ARENA GAGNÉE !');setTimeout(lobby,1400)}}function update(dt){if(!running||!alive)return;let mx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joyX,mz=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+joyY,n=Math.hypot(mx,mz);if(n>1){mx/=n;mz/=n}if(n>.08){player.rot=Math.atan2(mx,-mz);walk+=dt}player.x+=mx*7*dt;player.z+=mz*7*dt;player.x=Math.max(-8,Math.min(8,player.x));vy-=24*dt;player.y+=vy*dt;if(player.y<=0){player.y=0;vy=0;ground=true}camX+=(player.x-camX)*Math.min(1,dt*7);camZ+=((player.z+7)-camZ)*Math.min(1,dt*4);if(mode==='sun'){lt+=dt;if(lt>(light?3:2.5)){light=!light;lt=0;turnDelay=light?0:1}if(!light&&n>.08){turnDelay-=dt;if(turnDelay<=0){alive=false;shake=1;toast('💀 LA POUPÉE T’A VU !');setTimeout(lobby,1500)}}if(player.z<-37&&!won){won=true;toast('🏆 VICTOIRE !');setTimeout(lobby,1500)}}if(mode==='glass'){for(const v of panels)if(Math.abs(player.z-v.z)<1.8&&Math.abs(player.x)<4){let side=player.x<0?-1:1;if(side!==v.safe){alive=false;shake=1;toast('💥 VITRE CASSÉE !');setTimeout(lobby,1500);break}}if(player.z<-40&&!won){won=true;toast('🏆 PONT TRAVERSÉ !');setTimeout(lobby,1500)}}if(mode==='pvp'){for(const e of enemies){let dx=player.x-e.x,dz=player.z-e.z,d=Math.hypot(dx,dz);if(d<11&&d>.05){e.x+=dx/d*1.8*dt;e.z+=dz/d*1.8*dt}if(d<1.15){alive=false;shake=1;toast('💀 TU AS ÉTÉ ÉLIMINÉ !');setTimeout(lobby,1500)}}}}function dalgona(){let ui=document.createElement('div');ui.id='dalgona';ui.style.cssText='position:fixed;inset:0;z-index:40;background:radial-gradient(circle,#5a2811,#130805);display:flex;align-items:center;justify-content:center';ui.innerHTML='<div id="cookie" style="position:relative;width:min(78vw,440px);height:min(78vw,440px);border-radius:50%;background:radial-gradient(circle,#e8ad55,#b96d27);box-shadow:inset 0 0 0 12px #7d451d,0 25px 80px #000;font-family:Arial"><h2 style="position:absolute;top:-65px;width:100%;text-align:center;font-size:26px">🍪 TRACE SANS SORTIR !</h2><div style="position:absolute;inset:18%;border:7px dashed #593316;border-radius:50%;clip-path:polygon(50% 0,61% 34%,98% 35%,69% 57%,79% 100%,50% 72%,21% 100%,31% 57%,2% 35%,39% 34%);pointer-events:none"></div><div style="position:absolute;left:10%;right:10%;bottom:-55px;height:15px;border-radius:10px;background:#fff2;overflow:hidden"><div id="fill" style="height:100%;width:0;background:#48f19a"></div></div></div>';document.body.appendChild(ui);let cookie=$('cookie'),fill=$('fill'),progress=0,drawing=false;function trace(e){if(!drawing)return;let r=cookie.getBoundingClientRect(),xx=e.clientX-r.left,yy=e.clientY-r.top;if(Math.hypot(xx-r.width/2,yy-r.height/2)<r.width*.44){progress=Math.min(1,progress+.014);fill.style.width=progress*100+'%';if(progress>=1){ui.remove();toast('🏆 DALGONA RÉUSSIE !');setTimeout(lobby,1000)}}}cookie.onpointerdown=e=>{drawing=true;trace(e)};cookie.onpointermove=trace;addEventListener('pointerup',()=>drawing=false);setTimeout(()=>{if(ui.isConnected){ui.remove();toast('💀 DALGONA RATÉE !');setTimeout(lobby,1000)}},20000)}$('sunBtn').onclick=()=>start('sun');$('glassBtn').onclick=()=>start('glass');$('dalgonaBtn').onclick=()=>start('dalgona');$('pvpBtn').onclick=()=>start('pvp');$('back').onclick=lobby;$('jump').onclick=jump;$('attack').onclick=attack;addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.code==='Space')jump()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);let joy=$('joy'),knob=$('knob'),jd=false;function jm(e){let r=joy.getBoundingClientRect(),xx=e.clientX-r.left-r.width/2,yy=e.clientY-r.top-r.height/2,m=55,d=Math.hypot(xx,yy);if(d>m){xx=xx/d*m;yy=yy/d*m}joyX=xx/m;joyY=yy/m;knob.style.transform=`translate(calc(-50% + ${xx}px),calc(-50% + ${yy}px)`)}joy.onpointerdown=e=>{jd=true;joy.setPointerCapture(e.pointerId);jm(e)};joy.onpointermove=e=>{if(jd)jm(e)};joy.onpointerup=()=>{jd=false;joyX=joyY=0;knob.style.transform='translate(-50%,-50%)'};joy.onpointercancel=joy.onpointerup;function loop(t){let dt=Math.min(.04,(t-last||0)/1000);last=t;update(dt);draw();shake=Math.max(0,shake-dt*4);requestAnimationFrame(loop)}requestAnimationFrame(loop)})();</script></body></html>

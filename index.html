<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ultra Clicker</title><style>body{margin:0;background:#080d1d;color:white;font-family:Arial;text-align:center}.app{max-width:900px;margin:auto;padding:15px}.top{display:flex;justify-content:space-between;align-items:center}.money{background:#15213e;padding:12px 18px;border-radius:15px;font-weight:bold}.arena{min-height:520px;margin-top:20px;border-radius:30px;background:radial-gradient(circle,#193f7a,#090d1c 65%);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.click-wrap{width:min(360px,75vw);height:min(360px,75vw);padding:16px;border-radius:50%;background:#1c315b;box-shadow:0 0 45px #56eaff}.click-wrap:before{content:'';position:absolute;width:min(410px,85vw);height:min(410px,85vw);border:3px dashed #56eaff;border-radius:50%;animation:spin 10s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}#clickBtn{position:relative;z-index:2;width:100%;height:100%;border:0;border-radius:50%;font-size:130px;cursor:pointer;touch-action:manipulation;background:radial-gradient(circle at 35% 25%,#dfffff,#50eaff 25%,#2565d8 60%,#101c58);box-shadow:inset 0 10px 25px #fff8,inset 0 -25px 35px #0009,0 15px 0 #050a25;color:white;-webkit-tap-highlight-color:transparent;user-select:none}.click-info{position:absolute;bottom:35px;font-size:22px;font-weight:bold;color:#60efff}.float{position:fixed;pointer-events:none;color:#ffd75e;font-size:25px;font-weight:bold;animation:float .7s forwards}@keyframes float{to{transform:translateY(-100px);opacity:0}}.stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:20px 0}.stat{background:#121b34;border:1px solid #294675;padding:12px 25px;border-radius:15px}.skins{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}.skin{border:2px solid #294675;background:#111a30;color:white;padding:10px;border-radius:15px;cursor:pointer}.preview{width:80px;height:80px;border-radius:50%;margin:auto;display:grid;place-items:center;font-size:40px}.active{border-color:#55eaff!important;box-shadow:0 0 20px #55eaff}@media(max-width:600px){.arena{min-height:480px}}</style></head><body><div class="app"><header class="top"><h2>⚡ ULTRA CLICKER</h2><div class="money">⚡ <span id="energy">0</span></div></header><div class="stats"><div class="stat">👆 Clics : <span id="clicks">0</span></div><div class="stat">💪 Puissance : <span id="power">1</span></div><div class="stat">⭐ Niveau : <span id="level">1</span></div></div><div class="arena"><div class="click-wrap"><button id="clickBtn" type="button" aria-label="Cliquer">⚡</button></div><div class="click-info">TAPE POUR GAGNER DE L'ÉNERGIE !</div></div><h2>🎨 CHOISIS TON BOUTON</h2><div class="skins" id="skins"></div></div><script>const SKINS=[['⚡','#56eaff','#2565d8'],['🔥','#ffb14e','#b51616'],['💎','#79ffff','#604dff'],['🌙','#e4e7ff','#4d558b'],['☀️','#fff38a','#ff8500'],['❄️','#e9ffff','#318cff'],['🌋','#ff6b27','#721010'],['🪐','#d188ff','#3c1679'],['👾','#93ff7e','#147d48'],['❤️','#ff9dc9','#b20c5d'],['⭐','#fff4a0','#e38b00'],['⚙️','#e8edf7','#45536b'],['🐉','#ffc05b','#9c3215'],['🌊','#77f1ff','#1265b8'],['☁️','#ffffff','#7187ae'],['🍀','#b9ff7c','#20853a'],['👑','#ffe47c','#9c6612'],['💀','#dddddd','#222222'],['🌀','#9df7ff','#7138e5'],['🌹','#ff9fce','#b50b61']];let D;try{D=JSON.parse(localStorage.getItem('ultra_clicker_working'))||{energy:0,clicks:0,power:1,skin:0}}catch(e){D={energy:0,clicks:0,power:1,skin:0}}const btn=document.getElementById('clickBtn');function save(){localStorage.setItem('ultra_clicker_working',JSON.stringify(D))}function render(){document.getElementById('energy').textContent=Math.floor(D.energy).toLocaleString('fr-FR');document.getElementById('clicks').textContent=D.clicks.toLocaleString('fr-FR');document.getElementById('power').textContent=D.power;document.getElementById('level').textContent=Math.floor(Math.sqrt(D.clicks/25))+1;const s=SKINS[D.skin];btn.textContent=s[0];btn.style.background='radial-gradient(circle at 35% 25%,#ffffff,'+s[1]+' 28%,'+s[2]+' 72%)';document.querySelector('.click-wrap').style.boxShadow='0 0 45px '+s[1];document.getElementById('skins').innerHTML=SKINS.map((s,i)=>'<button class="skin '+(i===D.skin?'active':'')+'" data-i="'+i+'"><div class="preview" style="background:radial-gradient(circle,#fff,'+s[1]+','+s[2]+')">'+s[0]+'</div>STYLE '+(i+1)+'</button>').join('');document.querySelectorAll('.skin').forEach(x=>x.onclick=()=>{D.skin=Number(x.dataset.i);save();render()})}function gameClick(e){D.energy+=D.power;D.clicks++;save();render();const f=document.createElement('div');f.className='float';f.textContent='+'+D.power+' ⚡';const x=e&&e.clientX?e.clientX:window.innerWidth/2;const y=e&&e.clientY?e.clientY:window.innerHeight/2;f.style.left=x+'px';f.style.top=y+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),700)}btn.onclick=gameClick;btn.addEventListener('touchstart',function(e){e.preventDefault();gameClick(e.touches[0])},{passive:false});render();</script></body></html>

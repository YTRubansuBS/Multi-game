<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Squid Game 3D Ultra</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b;color:#fff;font-family:Arial,sans-serif;touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}.hidden{display:none!important}#menu{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#481526,#100a11 48%,#020306);padding:16px}.menuBox{width:min(94vw,760px);padding:34px;border:1px solid #ff416d66;border-radius:28px;background:#080b12ee;box-shadow:0 0 100px #ff174855,0 25px 80px #000;backdrop-filter:blur(14px);text-align:center}.logo{font-size:clamp(38px,7vw,72px);letter-spacing:5px;margin:0;text-shadow:0 0 25px #ff285c}.sub{color:#aeb8c7;margin:8px 0 25px}.games{display:grid;grid-template-columns:1fr 1fr;gap:16px}.gameBtn{min-height:105px;border:1px solid #ffffff18;border-radius:20px;background:linear-gradient(145deg,#171d27,#0c1018);color:#fff;font-size:17px;font-weight:900;cursor:pointer;box-shadow:inset 0 1px #fff1,0 10px 30px #0008;transition:.18s}.gameBtn:hover{transform:translateY(-4px);border-color:#ff416d88}.gameBtn b{display:block;font-size:34px;margin-bottom:6px}.gameBtn small{display:block;color:#9da8b8;margin-top:6px}.pink{color:#ff416d}.cyan{color:#54dfff}.gold{color:#ffd45a}.violet{color:#b68cff}.help{margin-top:18px;padding:14px;border-radius:15px;background:#ffffff08;border:1px solid #ffffff10;color:#9da8b8;line-height:1.6}#hud{position:fixed;z-index:15;left:14px;top:14px;display:none;gap:8px;flex-wrap:wrap;max-width:75%}.badge{padding:10px 14px;border:1px solid #fff2;border-radius:13px;background:#060a11dd;box-shadow:0 5px 20px #0008;font-weight:900;backdrop-filter:blur(8px)}#back{position:fixed;z-index:16;right:14px;top:14px;display:none;padding:12px 17px;border:1px solid #fff2;border-radius:13px;background:#090d14e8;color:#fff;font-weight:900}.hint{position:fixed;z-index:12;left:50%;top:18px;transform:translateX(-50%);padding:9px 15px;border-radius:12px;background:#05080de8;border:1px solid #fff2;display:none;font-weight:900}#toast{position:fixed;z-index:50;left:50%;bottom:180px;transform:translateX(-50%);display:none;padding:15px 22px;border-radius:15px;background:#060a10ee;border:1px solid #ffffff20;font-weight:900;box-shadow:0 10px 40px #000}#touch{position:fixed;inset:0;z-index:14;display:none;pointer-events:none}.joy{position:absolute;left:22px;bottom:24px;width:155px;height:155px;border-radius:50%;background:#ffffff0c;border:2px solid #ffffff2b;box-shadow:inset 0 0 30px #0008;pointer-events:auto}.knob{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px;border-radius:50%;background:#ffffff22;border:2px solid #fff7;box-shadow:0 5px 25px #0008}.action{position:absolute;border:1px solid #fff5;border-radius:50%;color:#fff;font-weight:900;pointer-events:auto;box-shadow:0 8px 25px #0008}.jump{right:24px;bottom:28px;width:108px;height:108px;background:#ff285ccc}.attack{right:145px;bottom:35px;width:78px;height:78px;background:#283342e8;font-size:23px}@media(max-width:650px){.games{grid-template-columns:1fr}.menuBox{padding:24px}.joy{width:135px;height:135px}.jump{width:95px;height:95px}.attack{right:125px;width:70px;height:70px}}</style></head><body><canvas id="game"></canvas><div id="menu"><div class="menuBox"><h1 class="logo">🦑 SQUID GAME</h1><div class="sub">ULTRA 3D • TROISIÈME PERSONNE</div><div class="games"><button class="gameBtn" id="sunBtn"><b class="pink">●</b>1, 2, 3 SOLEIL<small>Feu rouge = immobile</small></button><button class="gameBtn" id="glassBtn"><b class="cyan">◇</b>PONT EN VERRE<small>Choisis la bonne vitre</small></button><button class="gameBtn" id="dalgonaBtn"><b class="gold">★</b>DALGONA<small>Découpe la forme</small></button><button class="gameBtn" id="pvpBtn"><b class="violet">⚔</b>PVP ARENA<small>Combats les gardes</small></button></div><div class="help">💻 <b>PC</b> : WASD / flèches • ESPACE = saut<br>📱 <b>Mobile</b> : joystick + SAUT • ⚔️ attaque en PvP</div></div></div><div id="hud"><div class="badge" id="stage">ÉPREUVE</div><div class="badge" id="info">PRÊT</div><div class="badge" id="light">🟢 BOUGE</div></div><button id="back">☰ LOBBY</button><div id="touch"><div class="joy" id="joy"><div class="knob" id="knob"></div></div><button class="action attack" id="attack">⚔️</button><button class="action jump" id="jump">SAUT</button></div><div id="toast"></div><script>(function(){'use strict';const C=document.getElementById('game'),X=C.getContext('2d');let W=innerWidth,H=innerHeight,D=devicePixelRatio||1;function resize(){W=innerWidth;H=innerHeight;D=devicePixelRatio||1;C.width=W*D;C.height=H*D;X.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();const $=id=>document.getElementById(id);let mode='',running=false,alive=true,won=false,last=0,keys={},joyX=0,joyY=0,vy=0,ground=true,light=true,lt=0,shake=0,enemies=[],panels=[],camX=0,camZ=25,walk=0;let player={x:0,y:0,z:18,rot:0};function toast(t){let e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(e.t);e.t=setTimeout(()=>e.style.display='none',1700)}function P(x,y,z){return{x,y,z}}function proj(p){const cx=camX,cz=camZ,den=cz-p.z,scale=820/Math.max(5,den);return{x:W/2+(p.x-cx)*scale,y:H*.57-p.y*scale,scale}}function poly(a,f,s){X.beginPath();a.forEach((p,i)=>i?X.lineTo(p.x,p.y):X.moveTo(p.x,p.y));X.closePath();X.fillStyle=f;X.fill();if(s){X.strokeStyle=s;X.lineWidth=1;X.stroke()}}function q(a,b,c,d,f,s){poly([proj(a),proj(b),proj(c),proj(d)],f,s)}function cube(x,y,z,w,h,d,f){let a=P(x-w/2,y,z-d/2),b=P(x+w/2,y,z-d/2),c=P(x+w/2,y+h,z-d/2),d1=P(x-w/2,y+h,z-d/2),e=P(x-w/2,y,z+d/2),g=P(x+w/2,y,z+d/2),h1=P(x+w/2,y+h,z+d/2);q(a,b,c,d1,f);q(b,g,h1,c,f);q(d1,c,h1,P(x-w/2,y+h,z+d/2),f);q(e,a,d1,P(x-w/2,y+h,z+d/2),f);q(g,e,P(x-w/2,y+h,z+d/2),h1,f)}function limb(x,y,z,w,h,d,f,ang=0){let p=proj(P(x,y,z)),sc=p.scale;X.save();X.translate(p.x,p.y);X.rotate(ang);let ww=Math.max(3,w*sc),hh=Math.max(4,h*sc),dd=Math.max(2,d*sc);X.fillStyle=f;X.fillRect(-ww/2,-hh,ww,hh);X.fillStyle='#fff2';X.fillRect(-ww*.35,-hh,ww*.18,hh);X.restore()}function ball(x,y,z,r,f){let p=proj(P(x,y,z));X.fillStyle=f;X.beginPath();X.arc(p.x,p.y,Math.max(3,r*p.scale),0,Math.PI*2);X.fill()}function detailedPerson(px,py,pz,kind='player',scale=1,rot=0){const s=scale, moving=Math.sin(walk*9+pz*.1)*.18, suit=kind==='guard'?'#d51f52':'#157f62',skin='#d99670',dark='#15171c',shoe='#111319';let front=rot;/* shadow */let sh=proj(P(px,py+.02,pz));X.fillStyle='#0008';X.beginPath();X.ellipse(sh.x,sh.y+8,30*s*sh.scale/55,10*s*sh.scale/55,0,0,Math.PI*2);X.fill();/* legs */limb(px-.22*s,py,pz,.23*s,.68*s,.25*s, suit,moving);limb(px+.22*s,py,pz,.23*s,.68*s,.25*s,suit,-moving);cube(px-.22*s,py-.03,pz,.32*s,.16*s,.48*s,shoe);cube(px+.22*s,py-.03,pz,.32*s,.16*s,.48*s,shoe);/* pelvis and torso */cube(px,py+.58*s,pz,.92*s,.28*s,.52*s,suit);cube(px,py+.83*s,pz,.98*s,.92*s,.56*s,suit);/* zipper */cube(px,py+.9*s,pz-.285*s,.045*s,.75*s,.015*s,dark);/* arms */limb(px-.62*s,py+.86*s,pz,.22*s,.82*s,.23*s,suit,-.05+moving);limb(px+.62*s,py+.86*s,pz,.22*s,.82*s,.23*s,suit,.05-moving);ball(px-.63*s,py+.02*s,pz,.13*s,skin);ball(px+.63*s,py+.02*s,pz,.13*s,skin);/* neck */cube(px,py+1.72*s,pz,.25*s,.2*s,.25*s,skin);/* head */ball(px,py+2.02*s,pz,.39*s,kind==='guard'?dark:skin);/* hair/mask */if(kind==='player'){ball(px,py+2.12*s,pz-.22*s,.22*s,'#17191f');cube(px,py+2.03*s,pz-.34*s,.52*s,.12*s,.04*s,'#111318')}else{cube(px,py+2.04*s,pz-.36*s,.58*s,.45*s,.06*s,dark);let hp=proj(P(px,py+2.08*s,pz-.4*s));X.fillStyle='#ff315e';X.font=Math.max(9,12*s*hp.scale/55)+'px Arial';X.textAlign='center';X.fillText(kind==='doll'?'○':'△',hp.x,hp.y+4)}/* shoulder badge */if(kind==='guard'){let bp=proj(P(px-.53*s,py+1.32*s,pz-.3*s));X.fillStyle='#eee';X.font=Math.max(7,9*s*bp.scale/55)+'px Arial';X.textAlign='center';X.fillText('▣',bp.x,bp.y+3)}}function floor(){q(P(-45,0,-80),P(45,0,-80),P(45,0,35),P(-45,0,35),'#30363e');for(let z=-75;z<32;z+=5)q(P(-45,.01,z),P(45,.01,z),P(45,.01,z+.045),P(-45,.01,z+.045),'#ffffff12');for(let i=-40;i<=40;i+=5)q(P(i,.01,-80),P(i+.04,.01,-80),P(i+.04,.01,35),P(i,.01,35),'#ffffff09')}function arena(){X.clearRect(0,0,W,H);let g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,mode==='glass'?'#061327':'#080b12');g.addColorStop(.5,mode==='sun'?'#72b3c9':'#202936');g.addColorStop(1,'#05070b');X.fillStyle=g;X.fillRect(0,0,W,H);floor()}function sun(){for(let i=0;i<12;i++)cube(-22+i*4,0,-8,2.7,.08,1.4,i%2?'#e8eef2':'#bfc9d0');cube(0,0,-39,38,.5,1,'#ff315f');for(let i=-18;i<=18;i+=6)cube(i,.5,-38.3,2,.5,.5,'#161a20');detailedPerson(0,0,-43,'guard',1.8);let p=proj(P(0,4,-43));X.shadowBlur=30;X.shadowColor='#ff3159';X.fillStyle='#ff3159';X.beginPath();X.arc(p.x,p.y,22,0,Math.PI*2);X.fill();X.shadowBlur=0;X.font='900 18px Arial';X.textAlign='center';X.fillText('STOP',p.x,p.y+5)}function glass(){panels.forEach(qp=>{let c=qp.safe<0?'#ff5b7d':'#51dfff';cube(-2.35,.08,qp.z,3.7,.15,3.7,c+'55');cube(2.35,.08,qp.z,3.7,.15,3.7,c+'55');cube(-4.25,0,qp.z,.12,2.2,3.7,'#d8e5ed33');cube(4.25,0,qp.z,.12,2.2,3.7,'#d8e5ed33')});cube(0,0,-38,12,.35,3,'#54dfff55')}function pvp(){enemies.forEach(e=>detailedPerson(e.x,e.y,e.z,'guard',1));for(let r=2;r<18;r+=4){let p=proj(P(0,.02,8));X.strokeStyle='#ffffff12';X.beginPath();X.arc(p.x,p.y,r*35,0,Math.PI*2);X.stroke()}}function draw(){arena();if(mode==='sun')sun();if(mode==='glass')glass();if(mode==='pvp')pvp();if(mode!=='dalgona')detailedPerson(player.x,player.y,player.z,'player',1,player.rot);if(mode==='sun'){X.font='900 25px Arial';X.textAlign='center';X.fillStyle=light?'#55ff9b':'#ff416d';X.fillText(light?'🟢 BOUGE':'🔴 STOP',W/2,75)}if(shake>0){X.fillStyle='#ff174844';X.fillRect(0,0,W,H)}}function start(m){mode=m;running=true;alive=true;won=false;light=true;lt=0;vy=0;ground=true;shake=0;walk=0;player={x:0,y:0,z:18,rot:0};panels=[];enemies=[];camX=0;camZ=25;$('menu').classList.add('hidden');$('hud').style.display='flex';$('back').style.display='block';$('touch').style.display=m==='dalgona'?'none':'block';$('attack').style.display=m==='pvp'?'block':'none';$('light').style.display=m==='sun'?'block':'none';$('stage').textContent={sun:'🟢 1, 2, 3 SOLEIL',glass:'🌉 PONT EN VERRE',dalgona:'🍪 DALGONA',pvp:'⚔️ PVP ARENA'}[m];$('info').textContent={sun:'Atteins la ligne d’arrivée',glass:'Une vitre sur deux est sûre',dalgona:'Découpe la forme',pvp:'Élimine tous les gardes'}[m];if(m==='glass')for(let i=0;i<14;i++)panels.push({z:10-i*4.5,safe:i%2?-1:1});if(m==='pvp')for(let i=0;i<7;i++)enemies.push({x:(i-3)*3.2,y:0,z:-5-i*3,hp:3,hit:0});if(m==='dalgona')dalgona();toast('🎮 ÉPREUVE LANCÉE')}function lobby(){running=false;$('menu').classList.remove('hidden');$('hud').style.display='none';$('back').style.display='none';$('touch').style.display='none';let d=$('dalgona');if(d)d.remove()}function jump(){if(running&&alive&&ground&&mode!=='dalgona'){vy=9.5;ground=false}}function attack(){if(mode!=='pvp'||!alive)return;let hit=false;enemies.forEach(e=>{if(Math.hypot(e.x-player.x,e.z-player.z)<3.2){e.hp--;e.hit=.2;e.z-=1.2;hit=true}});toast(hit?'⚔️ COUP PORTÉ !':'⚔️ DANS LE VIDE');enemies=enemies.filter(e=>e.hp>0);if(!enemies.length){won=true;toast('🏆 ARENA GAGNÉE !');setTimeout(lobby,1400)}}function update(dt){if(!running||!alive)return;const mx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joyX,mz=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+joyY,n=Math.hypot(mx,mz);let ax=mx,az=mz;if(n>1){ax/=n;az/=n}if(n>.08){player.rot=Math.atan2(ax,-az);walk+=dt}player.x+=ax*7*dt;player.z+=az*7*dt;player.x=Math.max(-8,Math.min(8,player.x));vy-=24*dt;player.y+=vy*dt;if(player.y<=0){player.y=0;vy=0;ground=true}/* third-person follow camera */camX+=(player.x-camX)*Math.min(1,dt*7);camZ+=((player.z+7)-camZ)*Math.min(1,dt*4);if(mode==='sun'){lt+=dt;if(lt>(light?2.7:2.1)){light=!light;lt=0}$('light').textContent=light?'🟢 BOUGE':'🔴 STOP';if(!light&&n>.15){alive=false;shake=1;toast('💀 TU AS BOUGÉ !');setTimeout(lobby,1500)}if(player.z<-37&&!won){won=true;toast('🏆 VICTOIRE !');setTimeout(lobby,1500)}}if(mode==='glass'){for(const qp of panels){if(Math.abs(player.z-qp.z)<1.8&&Math.abs(player.x)<4){let side=player.x<0?-1:1;if(side!==qp.safe){alive=false;shake=1;toast('💥 VITRE CASSÉE !');setTimeout(lobby,1500);break}}}if(player.z<-40&&!won){won=true;toast('🏆 PONT TRAVERSÉ !');setTimeout(lobby,1500)}}if(mode==='pvp'){for(const e of enemies){const dx=player.x-e.x,dz=player.z-e.z,d=Math.hypot(dx,dz);if(d<11&&d>.05){e.x+=dx/d*1.8*dt;e.z+=dz/d*1.8*dt}if(d<1.15){alive=false;shake=1;toast('💀 TU AS ÉTÉ ÉLIMINÉ !');setTimeout(lobby,1500)}}}}function dalgona(){const ui=document.createElement('div');ui.id='dalgona';ui.style.cssText='position:fixed;inset:0;z-index:40;background:radial-gradient(circle,#5a2811,#130805);display:flex;align-items:center;justify-content:center';ui.innerHTML='<div id="cookie" style="position:relative;width:min(78vw,440px);height:min(78vw,440px);border-radius:50%;background:radial-gradient(circle,#e8ad55,#b96d27);box-shadow:inset 0 0 0 12px #7d451d,0 25px 80px #000;font-family:Arial"><h2 style="position:absolute;top:-65px;width:100%;text-align:center;font-size:26px">🍪 TRACE SANS SORTIR !</h2><div style="position:absolute;inset:18%;border:7px dashed #593316;border-radius:50%;clip-path:polygon(50% 0,61% 34%,98% 35%,69% 57%,79% 100%,50% 72%,21% 100%,31% 57%,2% 35%,39% 34%);pointer-events:none"></div><div style="position:absolute;left:10%;right:10%;bottom:-55px;height:15px;border-radius:10px;background:#fff2;overflow:hidden"><div id="fill" style="height:100%;width:0;background:#48f19a"></div></div></div>';document.body.appendChild(ui);let cookie=$('cookie'),fill=$('fill'),progress=0,drawing=false;function trace(e){if(!drawing)return;let r=cookie.getBoundingClientRect(),xx=e.clientX-r.left,yy=e.clientY-r.top;if(Math.hypot(xx-r.width/2,yy-r.height/2)<r.width*.44){progress=Math.min(1,progress+.014);fill.style.width=progress*100+'%';if(progress>=1){ui.remove();toast('🏆 DALGONA RÉUSSIE !');setTimeout(lobby,1000)}}}cookie.onpointerdown=e=>{drawing=true;trace(e)};cookie.onpointermove=trace;addEventListener('pointerup',()=>drawing=false);setTimeout(()=>{if(ui.isConnected){ui.remove();toast('💀 DALGONA RATÉE !');setTimeout(lobby,1000)}},20000)}$('sunBtn').onclick=()=>start('sun');$('glassBtn').onclick=()=>start('glass');$('dalgonaBtn').onclick=()=>start('dalgona');$('pvpBtn').onclick=()=>start('pvp');$('back').onclick=lobby;$('jump').onclick=jump;$('attack').onclick=attack;addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.code==='Space')jump()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);const joy=$('joy'),knob=$('knob');let jd=false;function jm(e){let r=joy.getBoundingClientRect(),xx=e.clientX-r.left-r.width/2,yy=e.clientY-r.top-r.height/2,m=55,d=Math.hypot(xx,yy);if(d>m){xx=xx/d*m;yy=yy/d*m}joyX=xx/m;joyY=yy/m;knob.style.transform=`translate(calc(-50% + ${xx}px),calc(-50% + ${yy}px))`}joy.onpointerdown=e=>{jd=true;joy.setPointerCapture(e.pointerId);jm(e)};joy.onpointermove=e=>{if(jd)jm(e)};joy.onpointerup=()=>{jd=false;joyX=joyY=0;knob.style.transform='translate(-50%,-50%)'};joy.onpointercancel=joy.onpointerup;function loop(t){let dt=Math.min(.04,(t-last||0)/1000);last=t;update(dt);draw();shake=Math.max(0,shake-dt*4);requestAnimationFrame(loop)}requestAnimationFrame(loop)})();</script></body></html>

<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Multi-game</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial;background:#080b12;color:#fff}button,input{font:inherit}button{cursor:pointer}.hide{display:none!important}body{background:radial-gradient(circle at top,#182442,#080b12 60%)}#login{position:fixed;inset:0;display:grid;place-items:center;padding:18px}.card{width:min(520px,95vw);background:#0e1524f5;border:1px solid #ffffff18;border-radius:25px;padding:28px;box-shadow:0 25px 90px #000b;text-align:center}h1{font-size:46px;margin:0 0 8px;background:linear-gradient(90deg,#67e8f9,#a78bfa,#fb7185);color:transparent;background-clip:text}.muted{color:#8d9ab0}.users{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}.user{border:1px solid #ffffff14;border-radius:18px;padding:22px 10px;background:#131c2d;color:white;font-weight:bold}.user:hover{background:#1a2942;transform:translateY(-2px)}.av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;margin:auto auto 8px;background:linear-gradient(135deg,#5865f2,#ec4899)}#passbox{margin-top:15px;padding:14px;background:#ffffff06;border-radius:15px}input{width:100%;padding:13px;border-radius:11px;border:1px solid #ffffff16;background:#080d16;color:#fff;outline:0}.primary{width:100%;padding:13px;margin-top:9px;border:0;border-radius:11px;background:#5865f2;color:#fff;font-weight:bold}#error{color:#ff718f;min-height:18px;font-size:13px}header{height:64px;padding:10px 15px;display:flex;align-items:center;gap:10px;background:#090e18ed;border-bottom:1px solid #ffffff10}.brand{font-size:20px;font-weight:900}.me{margin-left:auto;display:flex;align-items:center;gap:8px}.mini{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#293650}.quit,.icon{border:1px solid #ffffff15;background:#121b2b;color:white;border-radius:10px;padding:9px 11px}.quit{margin-left:8px}main{height:calc(100% - 64px);display:flex}.side{width:320px;padding:14px;border-right:1px solid #ffffff10;overflow:auto}.title{font-size:12px;color:#738198;text-transform:uppercase;font-weight:bold;margin:4px 5px 10px}.person{width:100%;display:flex;align-items:center;gap:10px;padding:11px;border:1px solid transparent;background:transparent;color:#fff;border-radius:13px;text-align:left}.person:hover,.person.active{background:#ffffff08;border-color:#ffffff12}.person .av{width:42px;height:42px;margin:0}.info{flex:1}.info b{display:block}.state{font-size:12px;color:#7f8ca0}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#5d6878;margin-right:5px}.dot.on{background:#38d996;box-shadow:0 0 8px #38d996}.chat{flex:1;display:flex;flex-direction:column;min-width:0}.empty{margin:auto;text-align:center;color:#8491a5}.chathead{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid #ffffff10}.chathead .av{width:40px;height:40px;margin:0}.chatname{flex:1}.actions{display:flex;gap:7px}.messages{flex:1;overflow:auto;padding:17px;display:flex;flex-direction:column;gap:7px}.bubble{max-width:75%;padding:10px 13px;border-radius:16px;background:#172133;align-self:flex-start;word-break:break-word}.bubble.mine{align-self:flex-end;background:#5865f2}.small{font-size:10px;opacity:.6;margin-bottom:3px}.compose{display:flex;gap:8px;padding:11px;border-top:1px solid #ffffff10}.compose input{flex:1}.send{border:0;border-radius:11px;background:#5865f2;color:#fff;padding:0 17px;font-weight:bold}#incoming{position:fixed;top:15px;left:50%;transform:translateX(-50%);z-index:20;width:min(400px,92vw);background:#101827;border:1px solid #ffffff20;border-radius:17px;padding:15px;box-shadow:0 20px 70px #000}.incbuttons{display:flex;gap:8px;margin-top:10px}.incbuttons button{flex:1;border:0;border-radius:10px;padding:10px;font-weight:bold}.yes{background:#25c889;color:white}.no{background:#d83b5d;color:white}#call{position:fixed;right:15px;bottom:15px;width:min(500px,calc(100vw - 30px));z-index:19;background:#0b111dF7;border:1px solid #ffffff20;border-radius:19px;overflow:hidden;box-shadow:0 25px 90px #000b}.calltop{padding:12px 14px;border-bottom:1px solid #ffffff10;display:flex}.callinfo{flex:1}.videos{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:9px}.videos video{width:100%;aspect-ratio:16/10;background:#000;border-radius:12px;object-fit:cover}.controls{display:flex;gap:7px;padding:0 9px 9px}.controls button{flex:1;border:0;border-radius:10px;padding:10px;background:#263349;color:#fff;font-weight:bold}.controls .hang{background:#d9365b}.callstate{font-size:12px;color:#8190a6}#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:30;background:#121b2b;border:1px solid #ffffff18;padding:11px 15px;border-radius:11px;display:none}@media(max-width:700px){main{position:relative}.side{width:100%}.chat{display:none}.chat.mobile{display:flex;position:absolute;inset:0;background:#080b12}.side.mobile{display:none}.users{grid-template-columns:1fr 1fr}.bubble{max-width:88%}} </style></head><body><div id="login"><div class="card"><h1>MULTI-GAME</h1><p class="muted">Choisis ton compte</p><div class="users" id="users"></div><div id="passbox" class="hide"><b>Connexion à <span id="chosen"></span></b><input id="password" type="password" placeholder="Mot de passe" autocomplete="current-password"><button class="primary" id="connect">Se connecter</button><div id="error"></div></div><p class="muted" style="font-size:12px;margin-top:18px">Les appels restent actifs tant que cette page reste ouverte. Tu peux changer de conversation pendant un appel.</p></div></div><header id="header" class="hide"><div class="brand">💬 Multi-game</div><div class="me"><span class="mini" id="myav"></span><span id="myname"></span><button class="quit" id="logout">Quitter</button></div></header><main id="main" class="hide"><aside class="side" id="side"><div class="title">Contacts</div><div id="people"></div></aside><section class="chat" id="chat"><div class="empty"><div style="font-size:50px">👋</div><h2>Choisis une personne</h2><p>Messages, appels audio et vidéo.</p></div></section></main><div id="incoming" class="hide"><b>📞 Appel de <span id="incname"></span></b><div class="callstate" id="inctype">Appel audio</div><div class="incbuttons"><button class="yes" id="accept">Accepter</button><button class="no" id="decline">Refuser</button></div></div><div id="call" class="hide"><div class="calltop"><div class="callinfo"><b>📞 <span id="callname"></span></b><div class="callstate" id="callstate">Connexion…</div></div><button class="icon" id="hidecall">—</button></div><div class="videos"><video id="remote" autoplay playsinline></video><video id="local" autoplay playsinline muted></video></div><div class="controls"><button id="mute">🎙️ Micro</button><button id="cam">📷 Caméra</button><button class="hang" id="hang">☎️ Raccrocher</button></div></div><div id="toast"></div><script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script><script>
const NAMES=['Naim','Ilan','Juul','Ruben'],PASS={Naim:'Naim',Ilan:'Ilan',Juul:'Juul',Ruben:'Ruben'};const $=x=>document.getElementById(x);let me='',chosen='',peer=null,active='',call=null,stream=null,incoming=null,conns={},msgs={};const initials=n=>n.slice(0,2).toUpperCase(),key=(a,b)=>[a,b].sort().join('__');function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').style.display='none',2200)}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function accounts(){$('users').innerHTML=NAMES.map(n=>`<button class="user" data-n="${n}"><span class="av">${initials(n)}</span>${n}</button>`).join('');document.querySelectorAll('.user').forEach(x=>x.onclick=()=>{chosen=x.dataset.n;$('chosen').textContent=chosen;$('passbox').classList.remove('hide');$('password').value='';$('error').textContent='';$('password').focus()})}
$('connect').onclick=login;$('password').onkeydown=e=>e.key==='Enter'&&login();function login(){if(!chosen)return;if($('password').value!==PASS[chosen])return $('error').textContent='Mot de passe incorrect.';me=chosen;$('login').classList.add('hide');$('header').classList.remove('hide');$('main').classList.remove('hide');$('myname').textContent=me;$('myav').textContent=initials(me);renderPeople();initPeer()}
function renderPeople(){$('people').innerHTML=NAMES.filter(n=>n!==me).map(n=>`<button class="person" data-n="${n}"><span class="av">${initials(n)}</span><span class="info"><b>${n}</b><span class="state"><i class="dot" id="dot${n}"></i><span id="state${n}">Hors ligne</span></span></span></button>`).join('');document.querySelectorAll('.person').forEach(x=>x.onclick=()=>openChat(x.dataset.n))}
function online(n,on){$('dot'+n)?.classList.toggle('on',on);if($('state'+n))$('state'+n).textContent=on?'En ligne':'Hors ligne'}
function initPeer(){if(peer)return;if(!window.Peer)return toast('Service d’appel indisponible');peer=new Peer(me.toLowerCase(),{config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun.cloudflare.com:3478'}]}});peer.on('open',()=>{toast('Connecté ✓');pingAll()});peer.on('connection',c=>setup(c));peer.on('call',c=>incomingCall(c));peer.on('error',e=>{if(e.type==='unavailable-id')toast('Ce compte est déjà ouvert ailleurs')});setInterval(pingAll,7000)}
function setup(c){let n=c.peer[0].toUpperCase()+c.peer.slice(1);conns[n]=c;c.on('open',()=>{online(n,true);c.send({t:'hello'})});c.on('data',d=>{if(d.t==='hello')online(n,true);if(d.t==='msg')receiveMsg(n,d.text)});c.on('close',()=>{if(conns[n]===c)delete conns[n];online(n,false)})}
function pingAll(){NAMES.filter(n=>n!==me).forEach(n=>{if(!peer||peer.destroyed)return;let c=peer.connect(n.toLowerCase(),{reliable:true});let done=false,t=setTimeout(()=>{if(!done){done=true;try{c.close()}catch(e){}online(n,false)}},1500);c.on('open',()=>{if(done)return;done=true;clearTimeout(t);setup(c);online(n,true)});c.on('error',()=>{if(!done){done=true;clearTimeout(t);online(n,false)}})})}
function openChat(n){active=n;document.querySelectorAll('.person').forEach(x=>x.classList.toggle('active',x.dataset.n===n));$('side').classList.add('mobile');$('chat').classList.add('mobile');renderChat()}
function renderChat(){let n=active,k=key(me,n);msgs[k]??=[];$('chat').innerHTML=`<div class="chathead"><span class="av">${initials(n)}</span><div class="chatname"><b>${n}</b><div class="callstate">Messages</div></div><div class="actions"><button class="icon" id="audio">📞</button><button class="icon" id="video">📹</button><button class="icon" id="back">←</button></div></div><div class="messages" id="messages"></div><form class="compose" id="form"><input id="text" placeholder="Écrire un message…"><button class="send">Envoyer</button></form>`;let box=$('messages');msgs[k].forEach(m=>{let d=document.createElement('div');d.className='bubble '+(m.from===me?'mine':'');d.innerHTML=`<div class="small">${esc(m.from)}</div>${esc(m.text)}`;box.appendChild(d)});box.scrollTop=box.scrollHeight;$('form').onsubmit=e=>{e.preventDefault();send($('text').value)};$('audio').onclick=()=>startCall(n,false);$('video').onclick=()=>startCall(n,true);$('back').onclick=()=>{$('side').classList.remove('mobile');$('chat').classList.remove('mobile');active=''}}
function send(text){text=text.trim();if(!text||!active)return;let n=active,k=key(me,n);msgs[k]??=[];msgs[k].push({from:me,text});localStorage.setItem('mg_msgs',JSON.stringify(msgs));let c=conns[n];if(c?.open)c.send({t:'msg',text});else{c=peer.connect(n.toLowerCase(),{reliable:true});c.on('open',()=>{c.send({t:'msg',text});setup(c)})}renderChat()}
function receiveMsg(n,text){let k=key(me,n);msgs[k]??=[];msgs[k].push({from:n,text});localStorage.setItem('mg_msgs',JSON.stringify(msgs));if(active===n)renderChat();else toast('💬 Message de '+n)}
async function startCall(n,vid){if(call)return toast('Tu es déjà en appel');try{stream=await navigator.mediaDevices.getUserMedia({audio:true,video:vid})}catch(e){return toast('Autorise le micro'+(vid?' et la caméra':'')+' pour appeler')};call=peer.call(n.toLowerCase(),stream,{metadata:{from:me,video:vid}});showCall(n,vid,'Appel en cours…');wire(call,n)}
function incomingCall(c){if(call||incoming){c.close();return}incoming=c;let n=c.metadata?.from||c.peer[0].toUpperCase()+c.peer.slice(1);$('incname').textContent=n;$('inctype').textContent=c.metadata?.video?'Appel vidéo':'Appel audio';$('incoming').classList.remove('hide');$('accept').onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({audio:true,video:!!c.metadata?.video});call=c;$('incoming').classList.add('hide');showCall(n,!!c.metadata?.video,'Connexion…');wire(c,n);c.answer(stream)}catch(e){c.close();resetCall()}};$('decline').onclick=()=>{c.close();incoming=null;$('incoming').classList.add('hide')}}
function showCall(n,v,s){$('callname').textContent=n;$('callstate').textContent=s;$('call').classList.remove('hide');$('local').srcObject=stream;$('remote').srcObject=null;$('cam').style.display=v?'block':'none'}function wire(c,n){c.on('stream',s=>{$('remote').srcObject=s;$('callstate').textContent='Connecté'});c.on('close',resetCall);c.on('error',resetCall)}function resetCall(){try{stream?.getTracks().forEach(t=>t.stop())}catch(e){}stream=null;call=null;incoming=null;$('call').classList.add('hide');$('remote').srcObject=null;$('local').srcObject=null}
$('hang').onclick=()=>{try{call?.close()}catch(e){}resetCall()};$('mute').onclick=()=>{let t=stream?.getAudioTracks()[0];if(t){t.enabled=!t.enabled;$('mute').textContent=t.enabled?'🎙️ Micro':'🔇 Micro coupé'}};$('cam').onclick=()=>{let t=stream?.getVideoTracks()[0];if(t)t.enabled=!t.enabled};$('hidecall').onclick=()=>{$('call').classList.add('hide')};$('logout').onclick=()=>{try{call?.close();peer?.destroy()}catch(e){}resetCall();me='';peer=null;$('header').classList.add('hide');$('main').classList.add('hide');$('login').classList.remove('hide');$('passbox').classList.add('hide')};window.addEventListener('beforeunload',()=>{try{call?.close();peer?.destroy()}catch(e){}});try{msgs=JSON.parse(localStorage.getItem('mg_msgs')||'{}')}catch(e){}accounts();</script></body></html>

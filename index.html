<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Multi Game</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#10131c;color:white}.hidden{display:none!important}.screen{min-height:100vh;padding:16px}.card,.panel,.sidebar{background:#1a2030;border-radius:16px;padding:18px}.card{max-width:480px;margin:40px auto}.logo{text-align:center;font-size:36px;font-weight:bold;margin:10px}.form,.list,.nav{display:grid;gap:10px}input,button{font:inherit;border:0;border-radius:10px;padding:13px}input{background:#101522;color:white;width:100%}button{background:#4f7cff;color:white;font-weight:bold;cursor:pointer}.secondary{background:#283044}.tabs,.row{display:flex;gap:8px;flex-wrap:wrap}.tabs button{flex:1}.layout{display:grid;grid-template-columns:220px 1fr;gap:16px;margin-top:16px}.section{display:none}.section.active{display:block}.nav button{text-align:left;background:#252d40}.nav button.active{background:#4f7cff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.item{background:#252d40;padding:14px;border-radius:12px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#1a2030;padding:14px;border-radius:14px}.chat{height:280px;overflow:auto;background:#111622;border-radius:12px;padding:10px}.message{padding:8px;border-bottom:1px solid #283044}.game{position:relative;width:100%;height:520px;background:#e8f8ff;border:7px solid #657080;border-radius:16px;overflow:hidden;touch-action:none}.line{position:absolute;left:50%;width:4px;height:100%;background:#e94b5f}.goal{position:absolute;top:35%;height:30%;width:18px;background:#e94b5f}.left{left:0}.right{right:0}.paddle{position:absolute;width:28px;height:100px;border-radius:15px}.p1{left:35px;background:#3478ff}.p2{right:35px;background:#e94b5f}.puck{position:absolute;width:30px;height:30px;border-radius:50%;background:#111}.score{text-align:center;font-size:30px;color:#111;font-weight:bold;padding:8px}.touchControls{display:flex;justify-content:space-between;gap:12px;margin-top:12px}.touchSide{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1}.touchSide button{font-size:22px;min-height:60px}.error{color:#ff8b8b;min-height:20px}@media(max-width:700px){.layout{grid-template-columns:1fr}.sidebar{order:2}.topbar{flex-direction:column;align-items:stretch}.game{height:430px}.screen{padding:10px}}</style></head><body><section id="authScreen" class="screen"><div class="card"><div class="logo">🎮 MULTI GAME</div><div class="tabs"><button id="loginTab">Connexion</button><button id="registerTab" class="secondary">Créer un compte</button></div><div id="loginForm" class="form"><input id="loginEmail" type="email" placeholder="Adresse e-mail"><input id="loginPassword" type="password" placeholder="Mot de passe"><button id="loginBtn">Se connecter</button></div><div id="registerForm" class="form hidden"><input id="registerName" placeholder="Pseudo"><input id="registerEmail" type="email" placeholder="Adresse e-mail"><input id="registerPassword" type="password" placeholder="Mot de passe"><button id="registerBtn">Créer mon compte</button></div><div id="authError" class="error"></div></div></section><section id="appScreen" class="screen hidden"><div class="topbar"><b>🎮 MULTI GAME · <span id="userName"></span></b><div class="row"><button id="voiceBtn" class="secondary">🎙️ Micro</button><button id="logoutBtn" class="secondary">Déconnexion</button></div></div><div class="layout"><aside class="sidebar"><div class="nav"><button data-section="home" class="active">🏠 Accueil</button><button data-section="friends">👥 Amis</button><button data-section="rooms">🚪 Rooms</button></div></aside><main><div id="home" class="section active panel"><h2>Choisis un jeu</h2><div class="grid"><div class="item"><h2>🏒 Hockey</h2><p>Choisis ce jeu avant de créer ou rejoindre une room.</p><button id="chooseHockeyBtn">Choisir Hockey</button></div></div></div><div id="friends" class="section panel"><h2>👥 Amis</h2><div class="row"><input id="friendSearch" placeholder="Pseudo d'un joueur"><button id="addFriendBtn">Ajouter</button></div><div id="friendStatus" class="error"></div><h3>Demandes</h3><div id="requestsList" class="list"></div><h3>Mes amis</h3><div id="friendsList" class="list"></div></div><div id="rooms" class="section panel"><h2>🚪 Rooms <span id="selectedGameText"></span></h2><p id="roomHelp">Choisis d'abord un jeu.</p><div id="roomControls" class="hidden"><div class="row"><input id="roomName" placeholder="Nom de la room"><button id="createRoomBtn">Créer une room</button></div><h3>Rooms du jeu choisi</h3><div id="roomsList" class="list"></div><div id="roomArea" class="hidden"><h3 id="currentRoomTitle"></h3><div class="row"><button id="leaveRoomBtn" class="secondary">Quitter la room</button><button id="playRoomGameBtn">🏒 Jouer !</button></div><h3>💬 Chat</h3><div id="chatMessages" class="chat"></div><div class="row"><input id="chatInput" placeholder="Message..."><button id="sendChatBtn">Envoyer</button></div></div></div></div><div id="hockeyGame" class="section panel"><h2>🏒 Hockey</h2><div class="score"><span id="score1">0</span> - <span id="score2">0</span></div><div id="game" class="game"><div class="line"></div><div class="goal left"></div><div class="goal right"></div><div id="p1" class="paddle p1"></div><div id="p2" class="paddle p2"></div><div id="puck" class="puck"></div></div><div class="touchControls"><div class="touchSide"><button data-key="p1up">🔼</button><button data-key="p1down">🔽</button></div><div class="touchSide"><button data-key="p2up">🔼</button><button data-key="p2down">🔽</button></div></div><button id="startGameBtn">Commencer</button></div></main></div></section><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';import{getFirestore,doc,setDoc,getDoc,collection,addDoc,serverTimestamp,query,where,getDocs,onSnapshot,orderBy,limit,updateDoc,arrayUnion,arrayRemove}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';const firebaseConfig={apiKey:'AIzaSyBgtk06yhT02V1BK1mgle3hIMC3Iv7fMKc',authDomain:'multi-game-95bfc.firebaseapp.com',projectId:'multi-game-95bfc',storageBucket:'multi-game-95bfc.firebasestorage.app',messagingSenderId:'276458455031',appId:'1:276458455031:web:3c903925a37418f5bf38f2'};const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=x=>document.getElementById(x);let user,currentRoom=null,selectedGame=null,unsubs=[];function section(id){document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('[data-section]').forEach(x=>x.classList.toggle('active',x.dataset.section===id))}document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>section(b.dataset.section));$('loginTab').onclick=()=>{$('loginForm').classList.remove('hidden');$('registerForm').classList.add('hidden')};$('registerTab').onclick=()=>{$('registerForm').classList.remove('hidden');$('loginForm').classList.add('hidden')};$('loginBtn').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('loginEmail').value,$('loginPassword').value)}catch(e){$('authError').textContent=e.message}};$('registerBtn').onclick=async()=>{try{let n=$('registerName').value.trim();if(n.length<3)throw Error('Pseudo trop court');let r=await getDocs(query(collection(db,'users'),where('nameLower','==',n.toLowerCase())));if(!r.empty)throw Error('Pseudo déjà utilisé');let c=await createUserWithEmailAndPassword(auth,$('registerEmail').value,$('registerPassword').value);await setDoc(doc(db,'users',c.user.uid),{name:n,nameLower:n.toLowerCase(),friends:[],createdAt:serverTimestamp()})}catch(e){$('authError').textContent=e.message}};onAuthStateChanged(auth,async u=>{user=u;if(!u){$('authScreen').classList.remove('hidden');$('appScreen').classList.add('hidden');return}$('authScreen').classList.add('hidden');$('appScreen').classList.remove('hidden');let d=await getDoc(doc(db,'users',u.uid));$('userName').textContent=d.data()?.name||u.email;loadFriends()});$('logoutBtn').onclick=()=>signOut(auth);$('chooseHockeyBtn').onclick=()=>{selectedGame='hockey';$('selectedGameText').textContent='· 🏒 Hockey';$('roomHelp').textContent='Crée une room ou rejoins tes amis pour jouer au hockey.';$('roomControls').classList.remove('hidden');section('rooms');loadRooms()};$('addFriendBtn').onclick=async()=>{try{let r=await getDocs(query(collection(db,'users'),where('nameLower','==',$('friendSearch').value.trim().toLowerCase())));if(r.empty)throw Error('Joueur introuvable');let t=r.docs[0];if(t.id===user.uid)throw Error('Impossible');await setDoc(doc(db,'friendRequests',user.uid+'_'+t.id),{from:user.uid,to:t.id,status:'pending',createdAt:serverTimestamp()});$('friendStatus').textContent='Demande envoyée !'}catch(e){$('friendStatus').textContent=e.message}};function loadFriends(){onSnapshot(query(collection(db,'friendRequests'),where('to','==',user.uid)),async s=>{$('requestsList').innerHTML='';for(let x of s.docs.filter(d=>d.data().status==='pending')){let f=await getDoc(doc(db,'users',x.data().from));let el=document.createElement('div');el.className='item';el.innerHTML='👤 '+(f.data()?.name||'Joueur')+' <button>Accepter</button>';el.querySelector('button').onclick=async()=>{await updateDoc(x.ref,{status:'accepted'});await updateDoc(doc(db,'users',user.uid),{friends:arrayUnion(x.data().from)});await updateDoc(doc(db,'users',x.data().from),{friends:arrayUnion(user.uid)})};$('requestsList').appendChild(el)}});onSnapshot(doc(db,'users',user.uid),async d=>{$('friendsList').innerHTML='';for(let id of d.data()?.friends||[]){let f=await getDoc(doc(db,'users',id));if(f.exists())$('friendsList').innerHTML+='<div class="item">👤 '+f.data().name+'</div>'}})}$('createRoomBtn').onclick=async()=>{if(!selectedGame)return;let ref=await addDoc(collection(db,'rooms'),{name:$('roomName').value.trim()||'Room de '+$('userName').textContent,game:selectedGame,owner:user.uid,members:[user.uid],createdAt:serverTimestamp()});joinRoom(ref.id)};function loadRooms(){unsubs.forEach(f=>f());unsubs=[];unsubs.push(onSnapshot(query(collection(db,'rooms'),where('game','==',selectedGame)),s=>{$('roomsList').innerHTML='';s.forEach(d=>{let r=document.createElement('div');r.className='item';r.innerHTML='<b>'+d.data().name+'</b> <button>Rejoindre</button>';r.querySelector('button').onclick=()=>joinRoom(d.id);$('roomsList').appendChild(r)})}))}async function joinRoom(id){currentRoom=id;await updateDoc(doc(db,'rooms',id),{members:arrayUnion(user.uid)});$('roomArea').classList.remove('hidden');$('currentRoomTitle').textContent='Room : '+id;loadChat(id)};$('leaveRoomBtn').onclick=async()=>{if(currentRoom)await updateDoc(doc(db,'rooms',currentRoom),{members:arrayRemove(user.uid)});currentRoom=null;$('roomArea').classList.add('hidden')};$('playRoomGameBtn').onclick=()=>section('hockeyGame');function loadChat(id){onSnapshot(query(collection(db,'rooms',id,'messages'),orderBy('createdAt','desc'),limit(50)),async s=>{let a=[];for(let m of s.docs){let u=await getDoc(doc(db,'users',m.data().uid));a.push('<div class="message"><b>'+(u.data()?.name||'Joueur')+'</b> : '+esc(m.data().text)+'</div>')}$('chatMessages').innerHTML=a.reverse().join('')})}function esc(t){let d=document.createElement('div');d.textContent=t;return d.innerHTML}$('sendChatBtn').onclick=async()=>{let t=$('chatInput').value.trim();if(t&&currentRoom){await addDoc(collection(db,'rooms',currentRoom,'messages'),{uid:user.uid,text:t,createdAt:serverTimestamp()});$('chatInput').value=''}};let stream;$('voiceBtn').onclick=async()=>{try{if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;$('voiceBtn').textContent='🎙️ Micro'}else{stream=await navigator.mediaDevices.getUserMedia({audio:true});$('voiceBtn').textContent='🔴 Micro activé'}}catch(e){alert('Micro impossible : '+e.message)}};let run=false,keys={},puckX,puckY,vx,vy,p1Y,p2Y,s1=0,s2=0,raf;addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key,on=e=>{e.preventDefault();keys[k]=true},off=e=>{e.preventDefault();keys[k]=false};b.addEventListener('touchstart',on,{passive:false});b.addEventListener('touchend',off,{passive:false});b.addEventListener('touchcancel',off,{passive:false});b.addEventListener('mousedown',on);b.addEventListener('mouseup',off);b.addEventListener('mouseleave',off)});$('startGameBtn').onclick=()=>{cancelAnimationFrame(raf);run=true;s1=s2=0;$('score1').textContent=0;$('score2').textContent=0;let g=$('game');p1Y=p2Y=g.clientHeight/2-50;puckX=g.clientWidth/2;puckY=g.clientHeight/2;vx=Math.random()>.5?5:-5;vy=Math.random()*6-3;loop()};function loop(){if(!run)return;let g=$('game'),w=g.clientWidth,h=g.clientHeight;p1Y+=(keys.arrowup||keys.p1up?-7:0)+(keys.arrowdown||keys.p1down?7:0);p2Y+=(keys.w||keys.p2up?-7:0)+(keys.s||keys.p2down?7:0);p1Y=Math.max(0,Math.min(h-100,p1Y));p2Y=Math.max(0,Math.min(h-100,p2Y));puckX+=vx;puckY+=vy;if(puckY<=0||puckY>=h-30)vy*=-1;if(vx<0&&puckX<65&&puckY+30>p1Y&&puckY<p1Y+100)vx=Math.abs(vx);if(vx>0&&puckX>w-95&&puckY+30>p2Y&&puckY<p2Y+100)vx=-Math.abs(vx);if(puckX<0){s2++;$('score2').textContent=s2;reset()}if(puckX>w){s1++;$('score1').textContent=s1;reset()}$('p1').style.top=p1Y+'px';$('p2').style.top=p2Y+'px';$('puck').style.left=puckX+'px';$('puck').style.top=puckY+'px';raf=requestAnimationFrame(loop)}function reset(){let g=$('game');puckX=g.clientWidth/2;puckY=g.clientHeight/2;vx=-vx;vy=Math.random()*6-3}</script></body></html>

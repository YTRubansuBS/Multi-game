<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chaos Shift</title><style>*{box-sizing:border-box}body{margin:0;background:#080b14;color:white;font-family:Arial;text-align:center}button,input{font:inherit;border:0;border-radius:12px;padding:14px}button{cursor:pointer;font-weight:bold;background:#5865f2;color:white}.screen{min-height:100vh;display:grid;place-items:center;padding:20px}.panel{width:min(700px,95vw);background:#131927;border:1px solid #ffffff18;border-radius:25px;padding:28px;box-shadow:0 20px 70px #000}.logo{font-size:48px;font-weight:1000}.muted{color:#9da8bd}.grid{display:grid;gap:12px;margin-top:20px}.input{width:100%;background:#080d16;color:white;border:1px solid #ffffff20}.alt{background:#242d42}.hidden{display:none!important}.code{font-size:35px;letter-spacing:8px;font-weight:1000;margin:15px}.arena{height:65vh;min-height:420px;position:relative;overflow:hidden;margin:15px;border-radius:22px;background:radial-gradient(circle,#273557,#0d111d 70%);border:2px solid #ffffff18}.me{position:absolute;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#5865f2;border:3px solid white;font-weight:bold}.orb{position:absolute;width:25px;height:25px;border-radius:50%;background:#ffd84d;color:#402d00;display:grid;place-items:center;font-weight:bold;box-shadow:0 0 20px #ffd84d}.bad{position:absolute;border-radius:50%;background:#e84868aa;box-shadow:0 0 25px #e84868}.event{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#161d2e;padding:10px 18px;border-radius:20px;z-index:5;font-weight:bold}.hud{display:flex;justify-content:space-around;font-weight:bold}.list{display:grid;gap:8px;margin:15px}.row{background:#1c2537;padding:12px;border-radius:10px}.mobile{display:none}@media(max-width:700px){.mobile{display:block;position:absolute;bottom:15px;left:0;right:0}.mobile button{margin:4px;border-radius:50%;width:58px;height:58px}.arena{margin:5px}}
</style></head><body><section id="home" class="screen"><div class="panel"><div class="logo">⚡ CHAOS SHIFT</div><p class="muted">Le jeu où les règles changent sans prévenir.</p><div class="grid"><button id="solo">🎮 JOUER EN SOLO</button><button class="alt" id="create">👥 CRÉER UNE PARTIE</button><button class="alt" id="join">🔑 REJOINDRE AVEC UN CODE</button></div><div id="setup" class="grid hidden"><input id="name" class="input" maxlength="14" placeholder="Ton pseudo"><input id="room" class="input hidden" maxlength="6" placeholder="Code de partie"><button id="go">Continuer</button><div id="err" class="muted"></div></div></div></section><section id="lobby" class="screen hidden"><div class="panel"><h1>👥 SALLE</h1><div id="code" class="code"></div><p class="muted">Envoie ce code à tes amis.</p><div id="players" class="list"></div><button id="start">🚀 LANCER</button><button class="alt" id="copy">📋 COPIER</button></div></section><section id="game" class="hidden"><div class="hud"><span>⭐ <b id="score">0</b></span><span>❤️ <b id="hp">100</b></span><span>⏱️ <b id="time">300</b></span></div><div id="arena" class="arena"><div id="event" class="event">⚡ CHAOS</div><div class="mobile"><button data-k="ArrowLeft">←</button><button data-k="ArrowDown">↓</button><button data-k="ArrowUp">↑</button><button data-k="ArrowRight">→</button></div></div></section><section id="result" class="screen hidden"><div class="panel"><div class="logo">🏆 FIN !</div><h2 id="final"></h2><div id="ranking" class="list"></div><button onclick="location.reload()">🔄 REJOUER</button></div></section><script type="module">
const CFG={apiKey:'REMPLACE_TON_API_KEY',authDomain:'REMPLACE_TON_AUTH_DOMAIN',databaseURL:'REMPLACE_TON_DATABASE_URL',projectId:'REMPLACE_TON_PROJECT_ID',storageBucket:'REMPLACE_TON_STORAGE_BUCKET',messagingSenderId:'REMPLACE_TON_MESSAGING_SENDER_ID',appId:'REMPLACE_TON_APP_ID'};let db=null,F=null,ref=null,name='',room='',host=false,solo=false,started=false,x=.5,y=.5,score=0,hp=100,time=300,keys={},orbs=[],bad=[],ev='Normal',evTime=0,last=0,players={};const $=x=>document.getElementById(x);const show=x=>['home','lobby','game','result'].forEach(a=>$(a).classList.toggle('hidden',a!==x));
try{if(!CFG.apiKey.startsWith('REMPLACE')){const a=await import('https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js'),b=await import('https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js');const app=a.initializeApp(CFG);db=b.getDatabase(app);F=b}}catch(e){console.log(e)}
$('solo').onclick=()=>setup(false);$('create').onclick=()=>setup(false,true);$('join').onclick=()=>setup(true);function setup(j,c){$('setup').classList.remove('hidden');$('room').classList.toggle('hidden',!j);$('go').onclick=()=>j?join():create(c)}function pseudo(){name=$('name').value.trim()||'Joueur'+Math.floor(Math.random()*999)}
async function create(c){pseudo();host=true;solo=!c;if(solo)return start();room=Math.random().toString(36).slice(2,8).toUpperCase();show('lobby');$('code').textContent=room;if(!db){$('players').innerHTML='<div class="row">'+name+' — mode local</div>';return}ref=F.ref(db,'chaos/'+room);await F.set(ref,{status:'lobby',host:name,players:{[key()]:{name,score:0}}});listen()}
async function join(){pseudo();room=$('room').value.trim().toUpperCase();if(!db){$('err').textContent='Firebase doit être configuré pour rejoindre une vraie salle.';return}ref=F.ref(db,'chaos/'+room);F.onValue(ref,s=>{if(!s.exists()){$('err').textContent='Salle introuvable';return}const d=s.val();players=d.players||{};render();if(d.status==='game'&&!started)start();if(d.status==='result'&&started)finish()});await F.update(ref,{['players/'+key()]:{name,score:0}});show('lobby');$('code').textContent=room}
function listen(){F.onValue(ref,s=>{if(!s.exists())return;const d=s.val();players=d.players||{};render();if(d.status==='game'&&!started)start()})}function key(){return name.replace(/[.#$\[\]/g,'_')}function render(){$('players').innerHTML=Object.values(players).map(p=>'<div class="row">👤 '+p.name+' — '+(p.score||0)+' pts</div>').join('')}$('start').onclick=()=>{if(!host)return alert('Seul l’hôte peut lancer');if(db)F.update(ref,{status:'game'});start()};$('copy').onclick=()=>navigator.clipboard?.writeText(room);
function start(){started=true;score=0;hp=100;time=300;x=.5;y=.5;orbs=[];bad=[];evTime=0;show('game');for(let i=0;i<7;i++)orb();last=performance.now();requestAnimationFrame(loop)}function orb(){orbs.push({x:.05+Math.random()*.9,y:.12+Math.random()*.8})}function hazard(){bad.push({x:.1+Math.random()*.8,y:.15+Math.random()*.75,r:.04+Math.random()*.06,t:12})}
function loop(now){if(!started)return;let dt=Math.min(.05,(now-last)/1000);last=now;time-=dt;evTime-=dt;if(time<=0)return finish();if(evTime<=0)event();move(dt);orbs=orbs.filter(o=>{if(Math.hypot(o.x-x,o.y-y)<.045){score+=100;return false}return true});if(orbs.length<4)orb();bad=bad.filter(h=>{h.t-=dt;if(Math.hypot(h.x-x,h.y-y)<h.r+.025)hp=Math.max(0,hp-dt*20);return h.t>0});draw();if(Math.floor(time)!==Math.floor(time+dt))sync();requestAnimationFrame(loop)}
function move(dt){let dx=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0),dy=(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0);if(keys.d||keys.D)dx++;if(keys.a||keys.A)dx--;if(keys.s||keys.S)dy++;if(keys.w||keys.W)dy--;let m=ev==='VITESSE X2'?2:ev==='LENT'?0.45:1;if(ev==='CONTROLES INVERSÉS'){dx=-dx;dy=-dy}x=Math.max(.02,Math.min(.98,x+dx*.45*dt*m));y=Math.max(.1,Math.min(.96,y+dy*.45*dt*m))}
function event(){let e=[['NORMAL','Ramasse les orbes'],['VITESSE X2','Tout va deux fois plus vite'],['LENT','Tout ralentit'],['CONTROLES INVERSÉS','Attention !'],['PLUIE DE DANGER','Évite les zones rouges'],['PLUIE D’OR','Beaucoup d’orbes']][Math.floor(Math.random()*6)];ev=e[0];$('event').textContent='⚡ '+e[0];evTime=20;if(ev==='PLUIE DE DANGER')for(let i=0;i<5;i++)hazard();if(ev==='PLUIE D’OR')for(let i=0;i<15;i++)orb()}
function draw(){let a=$('arena');a.querySelectorAll('.me,.orb,.bad').forEach(e=>e.remove());let me=document.createElement('div');me.className='me';me.textContent=name.slice(0,2).toUpperCase();me.style.left=(x*100-2)+'%';me.style.top=(y*100-3)+'%';a.append(me);orbs.forEach(o=>{let e=document.createElement('div');e.className='orb';e.textContent='+';e.style.left=(o.x*100-1)+'%';e.style.top=(o.y*100-1)+'%';a.append(e)});bad.forEach(h=>{let e=document.createElement('div');e.className='bad';e.style.width=e.style.height=h.r*200+'%';e.style.left=(h.x-h.r)*100+'%';e.style.top=(h.y-h.r)*100+'%';a.append(e)});$('score').textContent=Math.floor(score);$('hp').textContent=Math.floor(hp);$('time').textContent=Math.ceil(time)}async function sync(){if(db&&!solo&&ref)F.update(ref,{['players/'+key()]:{name,score:Math.floor(score),hp:Math.floor(hp)}})}
function finish(){if(!started)return;started=false;if(db&&host)F.update(ref,{status:'result'});show('result');$('final').textContent=name+' : '+Math.floor(score)+' points';let a=Object.values(players);a.push({name,score});a.sort((x,y)=>y.score-x.score);$('ranking').innerHTML=a.map((p,i)=>'<div class="row">'+(i+1)+'. '+p.name+' — '+Math.floor(p.score||0)+' pts</div>').join('')}
addEventListener('keydown',e=>keys[e.key]=true);addEventListener('keyup',e=>keys[e.key]=false);document.querySelectorAll('.mobile button').forEach(b=>{b.ontouchstart=()=>keys[b.dataset.k]=true;b.ontouchend=()=>keys[b.dataset.k]=false});
</script></body></html>
